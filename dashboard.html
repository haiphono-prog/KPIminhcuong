<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Quản lý KPI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #000; overflow: hidden; margin: 0; }
        @media (max-width: 767.98px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Style cho thẻ KPI */
        .kpi-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .progress-thin { height: 6px; background-color: #333; border-radius: 10px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column animate__animated animate__fadeIn" style="background: #212529; z-index: 99999; overflow: hidden;">
        
        <!-- HEADER -->
        <div class="d-flex p-3 border-bottom border-secondary bg-dark flex-shrink-0 align-items-center mobile-margin-0" style="margin-left: -0.5px; margin-right: -0.5px; padding-top: max(env(safe-area-inset-top), 1rem) !important;">
            <button onclick="handleLogout()" class="btn btn-sm text-white-50 p-2 bg-transparent border-0 shadow-none">
                <i class="bi bi-box-arrow-left fs-4"></i>
            </button>
            <h6 class="fw-bold mb-0 text-info flex-grow-1 text-center" style="letter-spacing: 1px; font-size: 1.1rem; margin-right: 40px;" id="headerTitle">
                ĐANG TẢI...
            </h6>
        </div>

        <!-- BODY -->
        <div class="flex-grow-1 overflow-auto custom-scrollbar p-0 p-md-3">
            <div class="mobile-px-half" id="mainContent">
                
                <!-- Giao diện loading tạm thời -->
                <div class="text-center mt-5 text-white-50" id="loadingView">
                    <div class="spinner-border text-info mb-3" role="status"></div>
                    <p>Đang đồng bộ dữ liệu...</p>
                </div>

                <!-- PHÂN KHU 1: GIAO DIỆN ADMIN (Ẩn mặc định) -->
                <div id="adminView" class="d-none">
                    <div class="p-3">
                        <div class="text-white-50 small fw-bold mb-2">TỔNG QUAN CÔNG TY</div>
                        <!-- Nơi đổ dữ liệu danh sách nhân viên & KPI của họ -->
                        <div id="adminKpiList"></div>
                    </div>
                </div>

                <!-- PHÂN KHU 2: GIAO DIỆN NHÂN VIÊN (Ẩn mặc định) -->
                <div id="employeeView" class="d-none">
                    <div class="p-3">
                        <div class="text-white-50 small fw-bold mb-2">KPI CỦA TÔI THÁNG NÀY</div>
                        <!-- Nơi đổ dữ liệu KPI cá nhân -->
                        <div id="employeeKpiList"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- FOOTER: Chốt đáy -->
        <div class="d-flex mt-auto w-100 bg-dark border-top border-secondary flex-shrink-0" style="padding-bottom: env(safe-area-inset-bottom);" id="footerControls">
            <!-- Nút bấm sẽ thay đổi tùy theo Role -->
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        
        // 1. Đổi tên biến thành supabaseClient
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let currentProfile = null;

        // Chạy ngay khi mở trang
        document.addEventListener("DOMContentLoaded", checkSession);

        async function checkSession() {
            // 2. Dùng supabaseClient
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = "index.html"; // Chưa đăng nhập thì đuổi về
                return;
            }

            currentUser = session.user;
            await loadUserProfile();
        }

        async function loadUserProfile() {
            // 3. Dùng supabaseClient
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            
            document.getElementById('loadingView').classList.add('d-none');

            if (error || !data) {
                document.getElementById('headerTitle').innerText = "LỖI DỮ LIỆU";
                return;
            }

            currentProfile = data;
            document.getElementById('headerTitle').innerText = `XIN CHÀO, ${data.full_name.toUpperCase()}`;

            if (data.role === 'admin') {
                renderAdminView();
            } else {
                renderEmployeeView();
            }
        }

        
        // ================= CSS DÙNG CHUNG CHO Ô NHẬP LIỆU ĐẸP & SẮC NÉT =================
        // (Bạn có thể nhúng đoạn này vào thẻ <style> trên đầu file html nếu muốn)
        const customInputStyle = `
            background-color: #121416 !important; 
            border: 1px solid #2b3035 !important; 
            color: #ffffff !important;
            border-radius: 8px;
            padding: 10px 15px;
        `;

        // ================= GIAO DIỆN ADMIN CHUYÊN NGHIỆP =================
        async function renderAdminView() {
            document.getElementById('adminView').classList.remove('d-none');
            
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            let empCheckboxes = employees ? employees.map(e => `
                <div class="form-check form-check-inline text-white mb-2">
                    <input class="form-check-input emp-checkbox" type="checkbox" value="${e.id}" id="emp_${e.id}">
                    <label class="form-check-label text-white fw-bold" for="emp_${e.id}">${e.full_name}</label>
                </div>
            `).join('') : '<p class="text-muted">Chưa có nhân sự nào.</p>';

            document.getElementById('adminKpiList').innerHTML = `
                <div class="p-4 mb-4 rounded-4 shadow-sm" style="background: rgba(14, 165, 233, 0.08); border: 1px solid #0ea5e9;">
                    <h5 class="text-info fw-bold mb-3"><i class="bi bi-clipboard2-plus-fill me-2"></i>GIAO VIỆC CHUYÊN NGHIỆP</h5>
                    
                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">TÊN CÔNG VIỆC</label>
                        <input type="text" id="adminTaskName" class="form-control text-white" style="${customInputStyle}" placeholder="Ví dụ: Triển khai chiến dịch Marketing Q2">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label class="text-white fw-bold small mb-1">THỜI GIAN BẮT ĐẦU</label>
                            <input type="datetime-local" id="adminStartDate" class="form-control text-white" style="${customInputStyle}">
                        </div>
                        <div class="col-md-6">
                            <label class="text-white fw-bold small mb-1">THỜI GIAN KẾT THÚ (HẠN CHÓT)</label>
                            <input type="datetime-local" id="adminDueDate" class="form-control text-white" style="${customInputStyle}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">GIAO CHO NHÂN SỰ (CHỌN MỘT HOẶC NHIỀU)</label>
                        <div class="p-3 rounded-3" style="background: #121416; border: 1px solid #2b3035; max-height: 150px; overflow-y: auto;">
                            ${empCheckboxes}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">CÁC HẠNG MỤC CÔNG VIỆC (MỖI HẠNG MỤC MỘT DÒNG)</label>
                        <textarea id="adminSubtasks" class="form-control text-white" style="${customInputStyle}" rows="3" placeholder="1. Lên ý tưởng thiết kế&#10;2. Viết nội dung chi tiết&#10;3. Gửi duyệt Giám đốc"></textarea>
                    </div>

                    <button onclick="assignProfessionalTask()" class="btn btn-info w-100 fw-bold py-3 text-dark">PHÁT HÀNH CÔNG VIỆC</button>
                </div>
                <h6 class="text-white fw-bold mb-3">DANH SÁCH CÔNG VIỆC & THEO DÕI REALTIME</h6>
                <div id="allTasksContainer">Đang tải...</div>
            `;
            
            loadAllTasksAdmin();
            setupAdminRealtime(); // Lắng nghe realtime từ nhân viên
        }

        async function assignProfessionalTask() {
            const taskName = document.getElementById('adminTaskName').value.trim();
            const startDate = document.getElementById('adminStartDate').value;
            const dueDate = document.getElementById('adminDueDate').value;
            const subtasksText = document.getElementById('adminSubtasks').value.trim();
            
            const selectedEmps = Array.from(document.querySelectorAll('.emp-checkbox:checked')).map(cb => cb.value);

            if (!taskName) return alert("Vui lòng nhập tên công việc!");
            if (selectedEmps.length === 0) return alert("Vui lòng chọn ít nhất một nhân viên thực hiện!");

            const { data: taskData, error: taskError } = await supabaseClient.from('employee_kpis').insert([{
                task_name: taskName,
                assigned_by: currentUser.id,
                start_date: startDate ? new Date(startDate).toISOString() : null,
                due_date: dueDate ? new Date(dueDate).toISOString() : null,
                progress: 0,
                status: 'Đang làm'
            }]).select().single();

            if (taskError) return alert("Lỗi tạo việc: " + taskError.message);
            const taskId = taskData.id;

            let assigneeRows = selectedEmps.map(empId => ({ task_id: taskId, employee_id: empId }));
            await supabaseClient.from('task_assignees').insert(assigneeRows);

            if (subtasksText) {
                let lines = subtasksText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                let subtaskRows = lines.map(line => ({ task_id: taskId, title: line, is_completed: false }));
                await supabaseClient.from('subtasks').insert(subtaskRows);
            }

            alert("✅ Giao việc chuyên nghiệp thành công!");
            renderAdminView();
        }

        async function loadAllTasksAdmin() {
            const { data: tasks } = await supabaseClient.from('employee_kpis')
                .select('*, task_assignees(profiles(full_name)), subtasks(*)')
                .order('created_at', { ascending: false });

            let html = '';
            if (!tasks || tasks.length === 0) html = '<p class="text-white-50">Chưa có công việc nào được tạo.</p>';
            else {
                tasks.forEach(t => {
                    let assigneesStr = t.task_assignees.map(a => `<span class="badge bg-info text-dark me-1 fw-bold">👤 ${a.profiles.full_name}</span>`).join('');
                    let subtasksHtml = t.subtasks.map(s => `<div class="small text-white mb-1"><i class="bi ${s.is_completed ? 'bi-check-square-fill text-success' : 'bi-square text-warning'} me-2"></i>${s.title}</div>`).join('');
                    
                    html += `
                    <div class="p-3 mb-3 rounded-3 text-white" style="background: #1a1d20; border-left: 4px solid #0ea5e9; border: 1px solid #2b3035;" id="task_card_${t.id}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-white fw-bold mb-0 fs-5">${t.task_name}</h6>
                            <span class="badge bg-dark text-info border border-info fw-bold px-2 py-1 progress-badge-${t.id}">${t.progress}%</span>
                        </div>
                        <div class="mb-2">${assigneesStr}</div>
                        <div class="small text-warning mb-2 fw-semibold">
                            ⏱ Bắt đầu: ${t.start_date ? new Date(t.start_date).toLocaleString() : 'Không có'} &nbsp;|&nbsp; 
                            🏁 Hạn chót: ${t.due_date ? new Date(t.due_date).toLocaleString() : 'Không có'}
                        </div>
                        <div class="p-2 rounded mb-2 bg-black bg-opacity-50 border border-secondary">${subtasksHtml || '<span class="text-muted small">Không có hạng mục chi tiết</span>'}</div>
                        <div class="progress mt-2" style="height: 6px;"><div class="progress-bar bg-info progress-bar-${t.id}" style="width: ${t.progress}%"></div></div>
                    </div>`;
                });
            }
            document.getElementById('allTasksContainer').innerHTML = html;
        }

        // Bật Realtime cho Admin với cơ chế tự động kết nối lại
        function setupAdminRealtime() {
            // Lắng nghe thay đổi trên bảng employee_kpis
            const channel = supabaseClient.channel('admin-realtime-kpis')
                .on(
                    'postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'employee_kpis' }, 
                    payload => {
                        let updated = payload.new;
                        let badge = document.querySelector(`.progress-badge-${updated.id}`);
                        let bar = document.querySelector(`.progress-bar-${updated.id}`);
                        if(badge) badge.innerText = updated.progress + '%';
                        if(bar) bar.style.width = updated.progress + '%';
                    }
                )
                .subscribe((status) => {
                    console.log("Trạng thái Realtime Admin:", status);
                    // Nếu lỗi kênh, thử kết nối lại sau 2 giây
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        setTimeout(() => {
                            channel.subscribe();
                        }, 2000);
                    }
                });
        }


        // ================= GIAO DIỆN NHÂN VIÊN (BÁO CÁO ĐỊNH KỲ) =================
        function renderEmployeeView() {
            document.getElementById('employeeView').classList.remove('d-none');
            
            document.getElementById('footerControls').innerHTML = `
                <button onclick="checkIn()" class="btn py-3 fw-bold flex-grow-1 text-success bg-dark border-0 border-end border-secondary rounded-0"><i class="bi bi-geo-alt-fill me-2 fs-5"></i> ĐIỂM DANH</button>
                <button onclick="handleLogout()" class="btn py-3 fw-bold flex-grow-1 text-danger bg-dark border-0 rounded-0"><i class="bi bi-box-arrow-right me-2 fs-5"></i> THOÁT</button>
            `;
            
            document.getElementById('employeeKpiList').innerHTML = `
                <h6 class="text-info fw-bold mb-3"><i class="bi bi-journal-check me-2"></i>CÔNG VIỆC ĐƯỢC GIAO & BÁO CÁO TIẾN ĐỘ</h6>
                <div id="myTasksContainer">Đang tải công việc...</div>
            `;
            
            loadMyProfessionalTasks();
        }

        async function loadMyProfessionalTasks() {
            const { data: assignments } = await supabaseClient.from('task_assignees')
                .select('task_id')
                .eq('employee_id', currentUser.id);

            if (!assignments || assignments.length === 0) {
                document.getElementById('myTasksContainer').innerHTML = '<p class="text-white-50 text-center mt-4">Bạn chưa được giao công việc nào.</p>';
                return;
            }

            let taskIds = assignments.map(a => a.task_id);

            const { data: tasks } = await supabaseClient.from('employee_kpis')
                .select('*, subtasks(*)')
                .in('id', taskIds)
                .order('created_at', { ascending: false });

            let html = '';
            tasks.forEach(t => {
                let subtasksHtml = t.subtasks.map(s => `
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" ${s.is_completed ? 'checked' : ''} onchange="toggleSubtask('${s.id}', this.checked)" id="sub_${s.id}" style="transform: scale(1.2);">
                        <label class="form-check-label text-white fw-medium ms-2 ${s.is_completed ? 'text-decoration-line-through text-muted' : ''}" for="sub_${s.id}">
                            ${s.title}
                        </label>
                    </div>
                `).join('');

                html += `
                <div class="p-3 mb-3 rounded-3 text-white shadow-sm" style="background: #1a1d20; border-left: 4px solid ${t.progress === 100 ? '#198754' : '#0ea5e9'}; border: 1px solid #2b3035;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold fs-5 text-white">${t.task_name}</span>
                        <span class="badge bg-dark text-info border border-info fw-bold px-2 py-1">${t.progress}%</span>
                    </div>
                    <div class="small text-warning mb-3 fw-semibold">
                        ⏱ Bắt đầu: ${t.start_date ? new Date(t.start_date).toLocaleString() : 'Không có'} &nbsp;|&nbsp; 
                        🏁 Hạn chót: ${t.due_date ? new Date(t.due_date).toLocaleString() : 'Không có'}
                    </div>

                    <div class="p-3 rounded mb-3 bg-black bg-opacity-50 border border-secondary">
                        <div class="text-info fw-bold small mb-2"><i class="bi bi-list-check me-1"></i> CÁC HẠNG MỤC CÔNG VIỆC:</div>
                        ${subtasksHtml || '<span class="text-muted small">Không có hạng mục chi tiết.</span>'}
                    </div>

                    <!-- KHUNG BÁO CÁO TIẾN ĐỘ ĐỊNH KỲ TRONG NGÀY -->
                    <div class="p-3 rounded mb-3" style="background: rgba(14, 165, 233, 0.05); border: 1px dashed #0ea5e9;">
                        <div class="text-info fw-bold small mb-2"><i class="bi bi-clock-history me-1"></i> BÁO CÁO TIẾN ĐỘ ĐỊNH KỲ:</div>
                        <div class="row g-2">
                            <div class="col-6">
                                <select id="slot_${t.id}" class="form-control text-white form-select form-select-sm" style="${customInputStyle}">
                                    <option value="Đầu buổi sáng">☀️ Đầu buổi sáng</option>
                                    <option value="Cuối buổi sáng">🌤️ Cuối buổi sáng</option>
                                    <option value="Đầu buổi chiều">🌥️ Đầu buổi chiều</option>
                                    <option value="Cuối buổi chiều">🌙 Cuối buổi chiều</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <input type="number" id="prog_${t.id}" class="form-control text-white form-control-sm" style="${customInputStyle}" placeholder="Nhập % (0-100)" min="0" max="100" value="${t.progress}">
                            </div>
                        </div>
                        <div class="mt-2">
                            <input type="text" id="note_${t.id}" class="form-control text-white form-control-sm" style="${customInputStyle}" placeholder="Ghi chú chi tiết công việc đã làm...">
                        </div>
                        <button onclick="submitPeriodicReport('${t.id}')" class="btn btn-outline-info btn-sm w-100 fw-bold mt-2">GỬI BÁO CÁO CẬP NHẬT</button>
                    </div>

                    <div class="progress" style="height: 6px;"><div class="progress-bar ${t.progress === 100 ? 'bg-success' : 'bg-info'}" style="width: ${t.progress}%"></div></div>
                </div>`;
            });
            document.getElementById('myTasksContainer').innerHTML = html;
        }

        // Gửi báo cáo định kỳ theo các mốc thời gian
        async function submitPeriodicReport(taskId) {
            let slot = document.getElementById(`slot_${taskId}`).value;
            let percent = parseInt(document.getElementById(`prog_${taskId}`).value);
            let note = document.getElementById(`note_${taskId}`).value.trim();

            if (isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập phần trăm hợp lệ từ 0 đến 100!");

            // 1. Lưu vào bảng lịch sử báo cáo định kỳ task_updates
            await supabaseClient.from('task_updates').insert([{
                task_id: taskId,
                employee_id: currentUser.id,
                time_slot: slot,
                progress_percent: percent,
                note: note
            }]);

            // 2. Cập nhật tiến độ tổng thể của công việc (Realtime sẽ tự động đẩy lên cho Admin)
            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);

            alert(`✅ Đã gửi báo cáo [${slot}] thành công! Giám đốc đã nhận được cập nhật.`);
            loadMyProfessionalTasks();
        }

        async function toggleSubtask(subtaskId, isChecked) {
            await supabaseClient.from('subtasks').update({ is_completed: isChecked }).eq('id', subtaskId);

            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if(!subData) return;
            const taskId = subData.task_id;

            const { data: allSubs } = await supabaseClient.from('subtasks').select('*').eq('task_id', taskId);
            if(allSubs && allSubs.length > 0) {
                let completedCount = allSubs.filter(s => s.is_completed).length;
                let percent = Math.round((completedCount / allSubs.length) * 100);
                let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';

                await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            }

            loadMyProfessionalTasks();
        }

        // Hàm Điểm danh (Nhân viên)
        async function checkIn() {
            const { error } = await supabaseClient.from('attendance').insert([{ employee_id: currentUser.id }]);
            if(error) alert("❌ Điểm danh lỗi: " + error.message);
            else alert("✅ ĐIỂM DANH THÀNH CÔNG!\nChúc bạn một ngày làm việc hiệu quả!");
        }

        // Hàm cập nhật tiến độ (Nhân viên)
        async function updateProgress(taskId) {
            let percent = prompt("Nhập % hoàn thành công việc (Từ 0 đến 100):");
            if(percent === null || percent === '') return;
            
            percent = parseInt(percent);
            if(isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập số từ 0 đến 100");

            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            
            alert("✅ Đã cập nhật tiến độ!");
            loadMyTasks(); // Tải lại giao diện nhân viên
        }

        async function handleLogout() {
            // 4. Dùng supabaseClient
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
