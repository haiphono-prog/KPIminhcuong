<!DOCTYPE html>
<html lang="vi">
<head>

    <style>
        /* Khóa cuộn ngang chống vỡ giao diện, cho phép cuộn dọc tự nhiên nếu cần */
        body { background-color: #000; overflow-x: hidden; margin: 0; color: #fff; }
        
        .nav-menu-btn { transition: all 0.2s ease-in-out; }

        /* MENU MOBILE 1 DÒNG SIÊU GỌN */
        @media (max-width: 767px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
            .nav-menu-text { display: none; }
            
            /* Nút bình thường trên Mobile */
            .nav-menu-btn { background: transparent !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px; font-size: 1.1rem; opacity: 1 !important; }
            
            #headerTitle { font-size: 0.7rem !important; white-space: normal !important; overflow: visible !important; line-height: 1.3; text-align: left; }
        }

        /* MÀU NÚT MENU ĐANG CHỌN (ĐẶT Ở DƯỚI CÙNG ĐỂ GHI ĐÈ TUYỆT ĐỐI TRÊN MỌI THIẾT BỊ) */
        .nav-menu-btn.active-nav { background: #0ea5e9 !important; color: #000 !important; border-color: #0ea5e9 !important; opacity: 1 !important; }

        /* Ẩn thanh cuộn tàng hình */
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Style cho thẻ KPI */
        .kpi-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .progress-thin { height: 6px; background-color: #333; border-radius: 10px; margin-top: 8px; }

        /* GIAO DIỆN THẺ THỐNG KÊ CHUYÊN NGHIỆP (GLASSMORPHISM) */
        .stat-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 16px; padding: 20px; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: #3f3f46; }
        .stat-icon-box { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        
        /* THANH KÉO TIẾN ĐỘ ĐỔI MÀU THÔNG MINH (Chuẩn mọi trình duyệt) */
        .dynamic-slider { -webkit-appearance: none; -moz-appearance: none; appearance: none; width: 100%; border-radius: 5px; outline: none; background: #2b3035; }
        .dynamic-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #2b3035; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .dynamic-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #2b3035; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    /* HIỆU ỨNG THÔNG BÁO IPHONE (TOAST) & BẢNG TRƯỢT */
        .ios-toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%) translateY(-150px); background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 12px 16px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 12px; z-index: 9999999; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .ios-toast.show { transform: translateX(-50%) translateY(0); }
        .slide-panel { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 400px; background: #121416; z-index: 9999999; transform: translateX(100%); transition: transform 0.3s ease-in-out; border-left: 1px solid #3f3f46; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .slide-panel.open { transform: translateX(0); }
    </style>
</head>
<body>

                    <button onclick="window.location.href='accounts.html'" class="btn btn-sm nav-menu-btn btn-outline-light fw-bold text-nowrap"><i class="bi bi-people"></i><span class="nav-menu-text ms-1">PHÂN QUYỀN</span></button>

                    <button onclick="openNotifications()" class="btn btn-sm nav-menu-btn btn-outline-danger fw-bold text-nowrap position-relative">

    <!-- BẢNG HỎI XÁC NHẬN ĐIỂM DANH -->
    <div id="checkInModal" class="d-none" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999999;">
        <div class="w-100 h-100 d-flex align-items-center justify-content-center">
            <div class="p-4 rounded-4 shadow-lg bg-dark text-center" style="width: 90%; max-width: 400px; border: 1px solid #10b981;">

    <script>
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        
        // 1. Đổi tên biến thành supabaseClient
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let currentProfile = null;

        // Chạy ngay khi mở trang
        document.addEventListener("DOMContentLoaded", checkSession);

        async function checkSession() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "index.html";
                return;
            }
            currentUser = session.user;
            await loadUserProfile();
            
            // Kích hoạt tai nghe thông báo cho toàn bộ nhân sự và giám đốc
            setupGlobalRealtime(); 
        }

        async function loadUserProfile() {
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            
            document.getElementById('loadingView').classList.add('d-none');

            if (error || !data) {
                document.getElementById('headerTitle').innerText = "LỖI DỮ LIỆU";
                return;
            }

            currentProfile = data;

            // 1. Dịch mã quyền hạn sang Tiếng Việt để hiển thị lên Header cho trang trọng
            const roleNames = {
                'admin': 'GIÁM ĐỐC',
                'giam_doc': 'GIÁM ĐỐC',
                'pho_giam_doc': 'PHÓ GIÁM ĐỐC',
                'truong_phong': 'TRƯỞNG PHÒNG',
                'pho_phong': 'PHÓ PHÒNG',
                'employee': 'NHÂN VIÊN',
                'nhan_vien': 'NHÂN VIÊN'
            };
            let roleDisplay = roleNames[data.role] || 'NHÂN SỰ';

            // Hiển thị tên kèm chức danh
            document.getElementById('headerTitle').innerText = `XIN CHÀO, ${data.full_name.toUpperCase()} - ${roleDisplay}`;

            // Định tuyến nhóm Quản lý & Hiển thị Menu tương ứng
            const managementRoles = ['admin', 'pho_giam_doc', 'truong_phong', 'pho_phong'];
            if (managementRoles.includes(data.role)) {
                document.getElementById('adminMenu').classList.remove('d-none');
                document.getElementById('adminMenu').classList.add('d-flex');
                renderAdminView();
            } else {
                document.getElementById('employeeMenu').classList.remove('d-none');
                document.getElementById('employeeMenu').classList.add('d-flex');
                renderEmployeeView();
            }
        }
        let statusChart = null;
        let employeeChart = null;
        let attendanceChart = null; // Khai báo thêm biểu đồ điểm danh

        // HÀM CHUẨN HÓA NGÀY THÁNG VN (DD/MM/YYYY HH:MM)
        function formatDateVN(dateStr) {
            if (!dateStr) return 'Không có';
            let d = new Date(dateStr);
            let day = d.getDate().toString().padStart(2, '0');
            let month = (d.getMonth() + 1).toString().padStart(2, '0');
            let year = d.getFullYear();
            let hrs = d.getHours().toString().padStart(2, '0');
            let mins = d.getMinutes().toString().padStart(2, '0');
            return `${day}/${month}/${year} ${hrs}:${mins}`;
        }

        // Tự động tính toán màu sắc dựa trên Hạn chót
        function getDeadlineStatus(dueDateStr, progress) {
            if (progress === 100) return { color: 'success', hex: '#10b981', text: 'Đã hoàn thành' }; // Xanh lá
            if (!dueDateStr) return { color: 'info', hex: '#0ea5e9', text: 'Đang thực hiện' }; // Xanh dương (Không có hạn)

            let due = new Date(dueDateStr).getTime();
            let now = new Date().getTime();
            let hoursLeft = (due - now) / (1000 * 60 * 60);

            if (hoursLeft < 0) return { color: 'danger', hex: '#ef4444', text: 'QUÁ HẠN' }; // Đỏ
            if (hoursLeft <= 24) return { color: 'warning', hex: '#f59e0b', text: 'SẮP ĐẾN HẠN' }; // Vàng
            return { color: 'success', hex: '#10b981', text: 'Trong thời hạn' }; // Xanh lá
        }

        // ================= GIAO DIỆN ADMIN TỔNG QUAN TOÀN DIỆN =================
        async function renderAdminView() {
            document.getElementById('adminView').classList.remove('d-none');
            
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            let empCheckboxes = employees ? employees.map(e => `
                <div class="form-check form-check-inline text-white mb-2">
                    <input class="form-check-input emp-checkbox" type="checkbox" value="${e.id}" id="emp_${e.id}">
                    <label class="form-check-label text-white fw-bold" for="emp_${e.id}">${e.full_name}</label>
                </div>
            `).join('') : '<p class="text-muted">Chưa có nhân sự nào.</p>';

            document.getElementById('adminKpiList').innerHTML = `
                <!-- PHẦN 1: THẺ THỐNG KÊ (STATS CARDS) -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-info fw-bold mb-0"><i class="bi bi-building me-2"></i>TỔNG QUAN CÔNG TY</h5>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card" style="border-left: 4px solid #0ea5e9;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-white-50 fw-bold small mb-1">TỔNG CÔNG VIỆC</div>
                                    <h3 class="text-white fw-bold mb-0" id="statTotalTasks">0</h3>
                                </div>
                                <div class="stat-icon-box text-info" style="background: rgba(14, 165, 233, 0.15);"><i class="bi bi-journal-album"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card" style="border-left: 4px solid #10b981;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-white-50 fw-bold small mb-1">ĐÃ HOÀN THÀNH</div>
                                    <h3 class="text-white fw-bold mb-0" id="statCompleted">0</h3>
                                </div>
                                <div class="stat-icon-box text-success" style="background: rgba(16, 185, 129, 0.15);"><i class="bi bi-check2-all"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card" style="border-left: 4px solid #f59e0b;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-white-50 fw-bold small mb-1">ĐANG THỰC HIỆN</div>
                                    <h3 class="text-white fw-bold mb-0" id="statInProgress">0</h3>
                                </div>
                                <div class="stat-icon-box text-warning" style="background: rgba(245, 158, 11, 0.15);"><i class="bi bi-hourglass-split"></i></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PHẦN BIỂU ĐỒ CHUYÊN NGHIỆP TRỰC QUAN -->
                <div class="row g-3 mb-5">
                    <!-- Biểu đồ 1: Tỉ lệ hoàn thành (Doughnut khoét lỗ) -->

                    html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="p-3 rounded-4 shadow-sm border border-secondary" style="background: #1a1d20;">

       // Khai báo một biến để giữ đường truyền
        let myAdminChannel = null;

        // Thêm chữ "async" ở đầu hàm
        async function setupAdminRealtime() {
            // AWAIT TẠI ĐÂY LÀ CHÌA KHÓA: Đợi xóa sạch kết nối cũ rồi mới kết nối mới
            if (myAdminChannel) {
                await supabaseClient.removeChannel(myAdminChannel);
            } else {
                await supabaseClient.removeAllChannels();
            }

            myAdminChannel = supabaseClient.channel('admin-realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'employee_kpis' }, payload => {
                    let updated = payload.new;
                    
                    // 1. Ép nhảy số và thanh chạy trên giao diện giám đốc ngay lập tức (0 độ trễ)
                    let badges = document.querySelectorAll(`.progress-badge-${updated.id}`);
                    let bars = document.querySelectorAll(`.progress-bar-${updated.id}`);
                    badges.forEach(badge => badge.innerText = updated.progress + '%');
                    bars.forEach(bar => bar.style.width = updated.progress + '%');

                    // 2. Chạy ngầm tải lại biểu đồ và trạng thái hạng mục con
                    loadAllTasksAdmin(); 
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, payload => {
                    loadAttendanceAdmin(); 
                })
                .subscribe((status) => {
                    console.log("Trạng thái kết nối Realtime:", status);
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        // Thử kết nối lại nếu mạng của Admin bị rớt
                        setTimeout(() => myAdminChannel.subscribe(), 2000);
                    }
                });
        }

        async function assignProfessionalTask() {

            const subtasksText = document.getElementById('adminSubtasks').value.trim();
            
            const selectedEmps = Array.from(document.querySelectorAll('.emp-checkbox:checked')).map(cb => cb.value);

            if (!taskName) return alert("Vui lòng nhập tên công việc!");

            const { data: taskData, error: taskError } = await supabaseClient.from('employee_kpis').insert([{

            let assigneeRows = selectedEmps.map(empId => ({ task_id: taskId, employee_id: empId }));

            if (subtasksText) {

            tasks.sort((a, b) => {
                if (a.progress === 100 && b.progress !== 100) return 1;
                if (a.progress !== 100 && b.progress === 100) return -1;
                return 0; // Cùng trạng thái thì giữ nguyên
            });

            let html = '';
            tasks.forEach(t => {
                let statusInfo = getDeadlineStatus(t.due_date, t.progress); // Gọi hàm lấy màu

                let subtasksHtml = t.subtasks.map(s => {
                    let sVal = s.progress || 0;
                    
                    // Tính toán màu sắc mặc định lúc vừa tải trang
                    let color = '#0ea5e9';
                    if (sVal === 100) color = '#10b981';
                    else if (sVal <= 30) color = '#ef4444';
                    else if (sVal <= 60) color = '#f59e0b';
                    let bgStyle = `background: linear-gradient(to right, ${color} ${sVal}%, #2b3035 ${sVal}%);`;

                    return `
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-white small fw-medium">${s.title}</span>
                            <span class="text-info small fw-bold" id="sub_val_${s.id}">${sVal}%</span>
                        </div>
                        <input type="range" class="dynamic-slider" style="height: 8px; ${bgStyle}" min="0" max="100" value="${sVal}" 
                               oninput="updateSliderUI(this, '${s.id}')"
                               onchange="updateSubtaskProgress('${s.id}', this.value)">
                    </div>`;
                }).join('');

                // 2. THIẾT LẬP BUNG/THU Y NHƯ BÊN ADMIN
                let isCompleted = t.progress === 100;
                let bodyClass = isCompleted ? 'd-none' : ''; // Nếu xong 100% thì ẩn phần thân đi
                let iconClass = isCompleted ? 'bi-chevron-down' : 'bi-chevron-up'; // Nút mũi tên tương ứng

                html += `
                <div class="p-3 mb-3 rounded-3 text-white shadow-sm" style="background: #1a1d20; border-left: 5px solid ${statusInfo.hex}; border-right: 1px solid #2b3035; border-top: 1px solid #2b3035; border-bottom: 1px solid #2b3035;">
                    
                    <!-- HEADER CÔNG VIỆC CÓ THỂ BẤM VÀO ĐỂ BUNG/THU -->
                    <div class="d-flex justify-content-between align-items-center mb-2" style="cursor: pointer;" onclick="toggleTaskBody('${t.id}')">
                        <h6 class="fw-bold fs-5 text-white mb-0 d-flex align-items-center">
                            ${t.task_name}
                            <i class="bi ${iconClass} ms-2 text-white-50" id="icon_${t.id}"></i>
                        </h6>
                        <span class="badge bg-${statusInfo.color} fw-bold px-2 py-1">${t.progress}%</span>
                    </div>
                    
                    <!-- PHẦN THÂN CÔNG VIỆC (Được ẩn đi nếu đã 100%) -->
                    <div id="taskBody_${t.id}" class="${bodyClass}">
                        <div class="small text-${statusInfo.color} mb-3 fw-bold">
                            <i class="bi bi-clock-history me-1"></i> Trạng thái: ${statusInfo.text} <br>
                            <span class="text-white-50 fw-normal">🏁 Hạn chót: ${formatDateVN(t.due_date)}</span>
                        </div>

                        <div class="p-3 rounded mb-3 bg-black bg-opacity-50 border border-secondary">
                            <div class="text-info fw-bold small mb-3"><i class="bi bi-sliders me-1"></i> TIẾN ĐỘ TỪNG HẠNG MỤC:</div>
                            ${subtasksHtml || '<span class="text-muted small">Không có hạng mục chi tiết.</span>'}
                        </div>

                        <!-- KHUNG TRAO ĐỔI / GIẢI TRÌNH CHAT CỦA NHÂN VIÊN -->
                        <div class="p-3 rounded bg-black bg-opacity-50 border border-secondary mb-3">
                            <div class="text-info fw-bold small mb-2"><i class="bi bi-chat-dots-fill me-1"></i> TRAO ĐỔI & GIẢI TRÌNH:</div>
                            <div id="comments_box_${t.id}" class="mb-2 custom-scrollbar" style="max-height: 120px; overflow-y: auto;"></div>
                            <div class="input-group input-group-sm">
                                <input type="text" id="comment_input_${t.id}" class="form-control text-white bg-dark border-secondary" placeholder="Nhập giải trình lý do chậm, trao đổi...">
                                <button onclick="sendTaskComment('${t.id}')" class="btn btn-outline-info fw-bold">GỬI</button>
                            </div>
                        </div>
                    </div>

                    <!-- Thanh tiến độ luôn hiện bên dưới đáy -->
                    <div class="progress mt-2" style="height: 8px;"><div class="progress-bar bg-${statusInfo.color}" style="width: ${t.progress}%"></div></div>
                </div>`;

                // GỌI TẢI COMMENT SAU KHI VẼ XONG GIAO DIỆN
                setTimeout(() => loadTaskComments(t.id), 100);
            });
            document.getElementById('myTasksContainer').innerHTML = html;
        }

        // Tự động tính trung bình cộng các hạng mục lên thanh tiến độ chính
        async function updateSubtaskProgress(subtaskId, newProgressValue) {
            let pVal = parseInt(newProgressValue);
            
            // 1. Cập nhật tiến độ của chính hạng mục đó
            const { error: err1 } = await supabaseClient.from('subtasks').update({ progress: pVal, is_completed: pVal === 100 }).eq('id', subtaskId);
            if (err1) alert("Lỗi cập nhật hạng mục: " + err1.message);

            // 2. Kéo tất cả hạng mục của công việc này về để tính trung bình cộng
            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if (!subData) return;
            const taskId = subData.task_id;
            
            const { data: allSubs } = await supabaseClient.from('subtasks').select('progress').eq('task_id', taskId);
            
            if(allSubs && allSubs.length > 0) {
                let totalProgress = 0;
                allSubs.forEach(s => totalProgress += (s.progress || 0));
                let overallPercent = Math.round(totalProgress / allSubs.length); // Tính trung bình
                let status = overallPercent === 100 ? 'Hoàn thành' : 'Đang làm';

                // 3. Cập nhật tiến độ tổng thể của công việc
                const { error: err2 } = await supabaseClient.from('employee_kpis').update({ progress: overallPercent, status: status }).eq('id', taskId);
                if (err2) alert("Lỗi cập nhật tiến độ tổng: " + err2.message);
            }
            loadMyProfessionalTasks(); // Tải lại để cập nhật màu sắc
        }

        // HÀM ĐỔI MÀU THANH KÉO NGAY KHI ĐANG LƯỚT TAY
        function updateSliderUI(slider, id) {
            let val = parseInt(slider.value);
            document.getElementById(`sub_val_${id}`).innerText = val + '%';
            
            let color = '#0ea5e9'; // Xanh dương (Mặc định)
            if (val === 100) color = '#10b981'; // Xanh lá (Hoàn thành)
            else if (val <= 30) color = '#ef4444'; // Đỏ (Mới bắt đầu/Chậm trễ)
            else if (val <= 60) color = '#f59e0b'; // Vàng (Đang làm)

            // Đổ màu gradient: Phần đã kéo có màu, phần chưa kéo màu xám đen
            slider.style.background = `linear-gradient(to right, ${color} ${val}%, #2b3035 ${val}%)`;
        }
                    // Gửi báo cáo định kỳ theo các mốc thời gian
        async function submitPeriodicReport(taskId) {

            let percent = parseInt(document.getElementById(`prog_${taskId}`).value);

            await supabaseClient.from('task_updates').insert([{
                task_id: taskId,
                employee_id: currentUser.id,
                time_slot: slot,
                progress_percent: percent,
                note: note
            }]);

            // 2. Cập nhật tiến độ tổng thể của công việc (Realtime sẽ tự động đẩy lên cho Admin)

        async function toggleSubtask(subtaskId, isChecked) {
            await supabaseClient.from('subtasks').update({ is_completed: isChecked }).eq('id', subtaskId);

            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if(!subData) return;
            const taskId = subData.task_id;

            const { data: allSubs } = await supabaseClient.from('subtasks').select('*').eq('task_id', taskId);
            if(allSubs && allSubs.length > 0) {
                let completedCount = allSubs.filter(s => s.is_completed).length;
                let percent = Math.round((completedCount / allSubs.length) * 100);
                let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';

                await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            }

            loadMyProfessionalTasks();
        }

        async function checkAttendanceStatus() {
            const today = new Date();
            const vnTime = new Date(today.getTime() - (today.getTimezoneOffset() * 60000));
            vnTime.setUTCHours(0,0,0,0);
            
            const { data } = await supabaseClient.from('attendance')
                .select('*')
                .eq('employee_id', currentUser.id)
                .gte('created_at', vnTime.toISOString());

            let topBtn = document.getElementById('topCheckInBtn');
            if(!topBtn) return; 
            
            let checks = data || [];
            let count = checks.length; // Điếm số lần đã bấm (0 đến 4)
            let fillPercent = count * 25; // Tính phần trăm lấp đầy: 25%, 50%, 75%, 100%

            let hasMIn = checks.find(c => c.check_type === 'morning_in');
            let hasMOut = checks.find(c => c.check_type === 'morning_out');
            let hasAIn = checks.find(c => c.check_type === 'afternoon_in');
            let hasAOut = checks.find(c => c.check_type === 'afternoon_out');

            let nextCheck = ''; let btnText = '';
            
            if (!hasMIn) { nextCheck = 'morning_in'; btnText = 'ĐẦU SÁNG'; }
            else if (!hasMOut) { nextCheck = 'morning_out'; btnText = 'CUỐI SÁNG'; }
            else if (!hasAIn) { nextCheck = 'afternoon_in'; btnText = 'ĐẦU CHIỀU'; }
            else if (!hasAOut) { nextCheck = 'afternoon_out'; btnText = 'CUỐI CHIỀU'; }

            // Đổ màu nền nút dạng Progress Bar từ trái sang phải
            let bgFill = `linear-gradient(to right, rgba(16, 185, 129, 0.4) ${fillPercent}%, transparent ${fillPercent}%)`;

            if (nextCheck) {
                topBtn.className = "btn btn-sm nav-menu-btn fw-bold text-nowrap text-success border-success opacity-100";
                topBtn.style.background = bgFill;
                topBtn.disabled = false;
                topBtn.setAttribute('onclick', `openCheckInModal('${nextCheck}', '${btnText}')`);
                topBtn.innerHTML = `<i class="bi bi-geo-alt-fill"></i><span class="nav-menu-text ms-1">Đ.DANH (${count}/4)</span>`;
            } else {
                topBtn.className = "btn btn-sm nav-menu-btn fw-bold text-nowrap text-white border-success opacity-100";
                topBtn.style.background = "#10b981"; // Lấp đầy 100% màu xanh
                topBtn.disabled = true;
                topBtn.removeAttribute('onclick');
                topBtn.innerHTML = `<i class="bi bi-check-circle-fill"></i><span class="nav-menu-text ms-1">HOÀN TẤT</span>`;
            }
        }

    // ================= HÀM BỔ SUNG HẠNG MỤC SIÊU TỐC TỪ DASHBOARD =================
        async function addNewSubtask(taskId) {
            let input = document.getElementById(`new_subtask_${taskId}`);
            let title = input.value.trim();
            if(!title) return;

            // 1. Tìm số thứ tự (order_index) lớn nhất hiện tại để xếp hạng mục mới xuống cuối cùng
            const { data: existing } = await supabaseClient.from('subtasks').select('order_index').eq('task_id', taskId).order('order_index', {ascending: false}).limit(1);
            let nextIndex = (existing && existing.length > 0) ? (existing[0].order_index || 0) + 1 : 0;

            // 2. Lưu hạng mục mới vào CSDL (Mặc định tiến độ 0%)
            await supabaseClient.from('subtasks').insert([{
                task_id: taskId,
                title: title,
                progress: 0,
                is_completed: false,
                order_index: nextIndex
            }]);

            // 3. Kéo toàn bộ hạng mục (cũ + mới) về để tính toán lại % của Công việc gốc
            const { data: allSubs } = await supabaseClient.from('subtasks').select('progress').eq('task_id', taskId);
            let totalProgress = 0;
            allSubs.forEach(s => totalProgress += (s.progress || 0));
            
            // Chia trung bình cộng cho TỔNG số lượng hạng mục mới
            let newOverallPercent = Math.round(totalProgress / allSubs.length); 
            let newStatus = newOverallPercent === 100 ? 'Hoàn thành' : 'Đang làm';

            // 4. Cập nhật % mới lên hệ thống
            await supabaseClient.from('employee_kpis').update({ progress: newOverallPercent, status: newStatus }).eq('id', taskId);

            // 5. Xóa chữ trong ô nhập và tải lại giao diện
            input.value = '';
            loadAllTasksAdmin(); 
        }

        // Kiểm tra và bật/tắt chấm đỏ báo hiệu
        async function updateUnreadBadge() {
            let lastRead = localStorage.getItem(`last_read_ann_${currentUser.id}`) || 0;
            const { data } = await supabaseClient.from('announcements').select('created_at, target_users, sender_id').order('created_at', { ascending: false });
                
            let hasUnread = false;
            if (data) {
                // Lọc những thông báo của mình và không phải do mình gửi
                let myAnn = data.filter(a => (a.target_users === 'all' || (a.target_users && a.target_users.includes(currentUser.id))) && a.sender_id !== currentUser.id);
                if (myAnn.length > 0) {
                    let latestTime = new Date(myAnn[0].created_at).getTime();
                    if (latestTime > lastRead) hasUnread = true; // Có thông báo mới hơn lần đọc cuối
                }
            }
            
            let badges = document.querySelectorAll('.unread-badge');
            badges.forEach(b => {
                if(hasUnread) b.classList.remove('d-none');
                else b.classList.add('d-none');
            });
        }

        async function loadAnnouncements() {
            const { data: ann } = await supabaseClient.from('announcements').select('*, profiles(full_name, role)').order('created_at', { ascending: false });
            let html = '';
            
            if (ann && ann.length > 0) {
                // Lọc để chỉ hiển thị thông báo "Toàn công ty", "Đích danh mình", hoặc "Do mình gửi"
                let myAnn = ann.filter(a => a.target_users === 'all' || (a.target_users && a.target_users.includes(currentUser.id)) || a.sender_id === currentUser.id);
                
                if (myAnn.length === 0) {
                    html = '<div class="text-white-50 text-center mt-4">Bạn không có thông báo nào.</div>';
                } else {
                    myAnn.forEach(a => {
                        let timeStr = formatDateVN(a.created_at);
                        let isAll = a.target_users === 'all';
                        let targetLabel = isAll ? 'TOÀN CÔNG TY' : 'GỬI RIÊNG CÁ NHÂN';
                        let badgeColor = isAll ? 'bg-danger' : 'bg-warning text-dark';

                        html += `
                        <div class="mb-3 p-3 rounded-4 shadow-sm" style="background: #1a1d20; border: 1px solid #3f3f46;">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <span class="badge ${badgeColor} mb-1"><i class="bi bi-megaphone-fill me-1"></i>${targetLabel}</span>
                                    <div class="text-white-50 small">Từ: ${a.profiles.full_name}</div>
                                </div>
                                <span class="text-white-50 small">${timeStr}</span>
                            </div>
                            <h6 class="text-info fw-bold mb-1 mt-2">${a.title}</h6>
                            <p class="text-white small mb-3">${a.content}</p>
                            
                            <div class="p-2 rounded bg-black border border-secondary mb-2 custom-scrollbar" style="max-height: 200px; overflow-y: auto;" id="ann_replies_${a.id}">
                                <div class="text-center text-white-50 small placeholder-wave">Đang tải phản hồi...</div>
                            </div>
                            
                            <div class="input-group input-group-sm">
                                <input type="text" id="reply_input_${a.id}" class="form-control bg-dark border-secondary text-white" placeholder="Viết phản hồi / Xác nhận đã đọc..." onkeypress="if(event.key === 'Enter') replyAnnouncement('${a.id}')">
                                <button onclick="replyAnnouncement('${a.id}')" class="btn btn-outline-info fw-bold"><i class="bi bi-send"></i></button>
                            </div>
                        </div>`;
                        setTimeout(() => loadAnnouncementReplies(a.id), 100);
                    });
                }
            } else {
                html = '<div class="text-white-50 text-center mt-4">Chưa có thông báo nào từ Ban Giám đốc.</div>';
            }
            document.getElementById('announcementList').innerHTML = html;
        }

        async function loadAnnouncementReplies(annId) {
            const { data: replies } = await supabaseClient.from('announcement_replies').select('*, profiles(full_name, role)').eq('announcement_id', annId).order('created_at', { ascending: true });
            let container = document.getElementById(`ann_replies_${annId}`);
            if(!container) return;
            
            if (replies && replies.length > 0) {
                let html = replies.map(r => {
                    let isAdmin = ['admin', 'pho_giam_doc', 'truong_phong', 'pho_phong'].includes(r.profiles.role);
                    let color = isAdmin ? 'text-warning' : 'text-info';
                    return `<div class="small mb-1"><strong class="${color}">${r.profiles.full_name}:</strong> <span class="text-white-50">${r.message}</span></div>`;
                }).join('');
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            } else {
                container.innerHTML = '<div class="text-white-50 small fst-italic">Chưa có ai phản hồi.</div>';
            }
        }

        async function sendAnnouncement() {
            let target = document.getElementById('annTarget').value;
            let title = document.getElementById('annTitle').value.trim();
            let content = document.getElementById('annContent').value.trim();
            
            if(!title || !content) return alert("Vui lòng nhập đủ Tiêu đề và Nội dung!");
            
            const { error } = await supabaseClient.from('announcements').insert([{ 
                sender_id: currentUser.id, 
                title: title, 
                content: content,
                target_users: target 
            }]);
            if(error) alert("Lỗi gửi thông báo: " + error.message);
            else {
                document.getElementById('annTitle').value = '';
                document.getElementById('annContent').value = '';
                loadAnnouncements();
            }
        }

        async function replyAnnouncement(annId) {
            let input = document.getElementById(`reply_input_${annId}`);
            let message = input.value.trim();
            if(!message) return;
            const { error } = await supabaseClient.from('announcement_replies').insert([{ announcement_id: annId, sender_id: currentUser.id, message: message }]);
            if(!error) {
                input.value = '';
                loadAnnouncementReplies(annId);
            }
        }

        function showIosToast(title, desc) {
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastDesc').innerText = desc;
            let toast = document.getElementById('iosToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 6000); 
        }

        let globalAnnChannel = null;
        function setupGlobalRealtime() {
            updateUnreadBadge(); // Kiểm tra thông báo chưa đọc khi vừa đăng nhập

            if(globalAnnChannel) supabaseClient.removeChannel(globalAnnChannel);
            globalAnnChannel = supabaseClient.channel('public:announcements')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'announcements' }, payload => {
                    let ann = payload.new;
                    let isForMe = ann.target_users === 'all' || (ann.target_users && ann.target_users.includes(currentUser.id));
                    
                    if (ann.sender_id !== currentUser.id && isForMe) {
                        showIosToast(ann.title, ann.content);
                        updateUnreadBadge(); // Cập nhật chấm đỏ ngay lập tức
                    }
                    
                    if (document.getElementById('notificationPanel').classList.contains('open')) {
                        loadAnnouncements();
                        localStorage.setItem(`last_read_ann_${currentUser.id}`, new Date().getTime());
                        updateUnreadBadge();
                    }
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'announcement_replies' }, payload => {
                    let rep = payload.new;
                    if (document.getElementById('notificationPanel').classList.contains('open')) loadAnnouncementReplies(rep.announcement_id);
                }).subscribe();
        }
    </script>
    </body>
</html>
