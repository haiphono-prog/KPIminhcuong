<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Quản lý KPI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

    <style>
        body { background-color: #000; overflow: hidden; margin: 0; }
        @media (max-width: 767.98px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Style cho thẻ KPI */
        .kpi-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .progress-thin { height: 6px; background-color: #333; border-radius: 10px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column animate__animated animate__fadeIn" style="background: #212529; z-index: 99999; overflow: hidden;">
        
        <!-- HEADER -->
        <div class="d-flex p-3 border-bottom border-secondary bg-dark flex-shrink-0 align-items-center mobile-margin-0" style="margin-left: -0.5px; margin-right: -0.5px; padding-top: max(env(safe-area-inset-top), 1rem) !important;">
            <button onclick="handleLogout()" class="btn btn-sm text-white-50 p-2 bg-transparent border-0 shadow-none">
                <i class="bi bi-box-arrow-left fs-4"></i>
            </button>
            <h6 class="fw-bold mb-0 text-info flex-grow-1 text-center" style="letter-spacing: 1px; font-size: 1.1rem; margin-right: 40px;" id="headerTitle">
                ĐANG TẢI...
            </h6>
        </div>

        <!-- BODY -->
        <div class="flex-grow-1 overflow-auto custom-scrollbar p-0 p-md-3">
            <div class="mobile-px-half" id="mainContent">
                
                <!-- Giao diện loading tạm thời -->
                <div class="text-center mt-5 text-white-50" id="loadingView">
                    <div class="spinner-border text-info mb-3" role="status"></div>
                    <p>Đang đồng bộ dữ liệu...</p>
                </div>

                <!-- PHÂN KHU 1: GIAO DIỆN ADMIN (Ẩn mặc định) -->
                <div id="adminView" class="d-none">
                    <div class="p-3">
                        <div class="text-white-50 small fw-bold mb-2">TỔNG QUAN CÔNG TY</div>
                        <!-- Nơi đổ dữ liệu danh sách nhân viên & KPI của họ -->
                        <div id="adminKpiList"></div>
                    </div>
                </div>

                <!-- PHÂN KHU 2: GIAO DIỆN NHÂN VIÊN (Ẩn mặc định) -->
                <div id="employeeView" class="d-none">
                    <div class="p-3">
                        <div class="text-white-50 small fw-bold mb-2">KPI CỦA TÔI THÁNG NÀY</div>
                        <!-- Nơi đổ dữ liệu KPI cá nhân -->
                        <div id="employeeKpiList"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- FOOTER: Chốt đáy -->
        <div class="d-flex mt-auto w-100 bg-dark border-top border-secondary flex-shrink-0" style="padding-bottom: env(safe-area-inset-bottom);" id="footerControls">
            <!-- Nút bấm sẽ thay đổi tùy theo Role -->
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        
        // 1. Đổi tên biến thành supabaseClient
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let currentProfile = null;

        // Chạy ngay khi mở trang
        document.addEventListener("DOMContentLoaded", checkSession);

        async function checkSession() {
            // 2. Dùng supabaseClient
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = "index.html"; // Chưa đăng nhập thì đuổi về
                return;
            }

            currentUser = session.user;
            await loadUserProfile();
        }

        async function loadUserProfile() {
            // 3. Dùng supabaseClient
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            
            document.getElementById('loadingView').classList.add('d-none');

            if (error || !data) {
                document.getElementById('headerTitle').innerText = "LỖI DỮ LIỆU";
                return;
            }

            currentProfile = data;
            document.getElementById('headerTitle').innerText = `XIN CHÀO, ${data.full_name.toUpperCase()}`;

            if (data.role === 'admin') {
                renderAdminView();
            } else {
                renderEmployeeView();
            }
        }
        let statusChart = null;
        let employeeChart = null;

        // Tự động tính toán màu sắc dựa trên Hạn chót
        function getDeadlineStatus(dueDateStr, progress) {
            if (progress === 100) return { color: 'success', hex: '#10b981', text: 'Đã hoàn thành' }; // Xanh lá
            if (!dueDateStr) return { color: 'info', hex: '#0ea5e9', text: 'Đang thực hiện' }; // Xanh dương (Không có hạn)

            let due = new Date(dueDateStr).getTime();
            let now = new Date().getTime();
            let hoursLeft = (due - now) / (1000 * 60 * 60);

            if (hoursLeft < 0) return { color: 'danger', hex: '#ef4444', text: 'QUÁ HẠN' }; // Đỏ
            if (hoursLeft <= 24) return { color: 'warning', hex: '#f59e0b', text: 'SẮP ĐẾN HẠN' }; // Vàng
            return { color: 'success', hex: '#10b981', text: 'Trong thời hạn' }; // Xanh lá
        }

        // ================= GIAO DIỆN ADMIN TỔNG QUAN TOÀN DIỆN =================
        async function renderAdminView() {
            document.getElementById('adminView').classList.remove('d-none');
            
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            let empCheckboxes = employees ? employees.map(e => `
                <div class="form-check form-check-inline text-white mb-2">
                    <input class="form-check-input emp-checkbox" type="checkbox" value="${e.id}" id="emp_${e.id}">
                    <label class="form-check-label text-white fw-bold" for="emp_${e.id}">${e.full_name}</label>
                </div>
            `).join('') : '<p class="text-muted">Chưa có nhân sự nào.</p>';

            document.getElementById('adminKpiList').innerHTML = `
                <!-- PHẦN 1: TỔNG QUAN CÔNG TY -->
                <h5 class="text-info fw-bold mb-3"><i class="bi bi-building me-2"></i>1. TỔNG QUAN CÔNG TY</h5>
                <div class="row mb-4">
                    <div class="col-md-4 mb-3">
                        <div class="p-3 rounded-4 shadow-sm" style="background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none;">
                            <div class="text-white fw-bold mb-1"><i class="bi bi-list-task me-2"></i>TỔNG CÔNG VIỆC</div>
                            <h2 class="text-white fw-bold mb-0" id="statTotalTasks">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="p-3 rounded-4 shadow-sm" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">
                            <div class="text-white fw-bold mb-1"><i class="bi bi-check-circle-fill me-2"></i>ĐÃ HOÀN THÀNH</div>
                            <h2 class="text-white fw-bold mb-0" id="statCompleted">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="p-3 rounded-4 shadow-sm" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none;">
                            <div class="text-white fw-bold mb-1"><i class="bi bi-hourglass-split me-2"></i>ĐANG THỰC HIỆN</div>
                            <h2 class="text-white fw-bold mb-0" id="statInProgress">0</h2>
                        </div>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-4 mb-3">
                        <div class="p-3 rounded-4 shadow-sm h-100" style="background: #1a1d20; border: 1px solid #2b3035;">
                            <h6 class="fw-bold mb-3 text-info"><i class="bi bi-pie-chart-fill me-2"></i>TỈ LỆ HOÀN THÀNH</h6>
                            <div style="height: 200px; display: flex; justify-content: center;">
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <div class="p-3 rounded-4 shadow-sm h-100" style="background: #1a1d20; border: 1px solid #2b3035;">
                            <h6 class="fw-bold mb-3 text-info"><i class="bi bi-bar-chart-line-fill me-2"></i>PHÂN BỔ KHỐI LƯỢNG CHO NHÂN SỰ</h6>
                            <div style="height: 200px;">
                                <canvas id="employeeChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PHẦN 2: TỔNG QUAN TỪNG NHÂN SỰ -->
                <h5 class="text-warning fw-bold mb-3"><i class="bi bi-people-fill me-2"></i>2. TỔNG QUAN TỪNG NHÂN SỰ</h5>
                <div id="employeeOverviewContainer" class="row mb-5">
                    <!-- Dữ liệu từng nhân viên sẽ được đổ vào đây -->
                </div>

                <!-- PHẦN 3: GIAO VIỆC MỚI -->
                <h5 class="text-success fw-bold mb-3"><i class="bi bi-clipboard2-plus-fill me-2"></i>3. PHÁT HÀNH CÔNG VIỆC MỚI</h5>
                <div class="p-4 mb-5 rounded-4 shadow-sm" style="background: rgba(14, 165, 233, 0.08); border: 1px solid #0ea5e9;">
                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">TÊN CÔNG VIỆC</label>
                        <input type="text" id="adminTaskName" class="form-control text-white" style="${customInputStyle}" placeholder="Ví dụ: Triển khai chiến dịch Marketing Q2">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label class="text-white fw-bold small mb-1">THỜI GIAN BẮT ĐẦU</label>
                            <input type="datetime-local" id="adminStartDate" class="form-control text-white" style="${customInputStyle}">
                        </div>
                        <div class="col-md-6">
                            <label class="text-white fw-bold small mb-1">THỜI GIAN KẾT THÚ (HẠN CHÓT)</label>
                            <input type="datetime-local" id="adminDueDate" class="form-control text-white" style="${customInputStyle}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">GIAO CHO NHÂN SỰ (CHỌN MỘT HOẶC NHIỀU)</label>
                        <div class="p-3 rounded-3" style="background: #121416; border: 1px solid #2b3035; max-height: 150px; overflow-y: auto;">
                            ${empCheckboxes}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="text-white fw-bold small mb-1">CÁC HẠNG MỤC CÔNG VIỆC</label>
                        <textarea id="adminSubtasks" class="form-control text-white" style="${customInputStyle}" rows="3" placeholder="1. Lên ý tưởng thiết kế&#10;2. Viết nội dung chi tiết..."></textarea>
                    </div>
                    <button onclick="assignProfessionalTask()" class="btn btn-info w-100 fw-bold py-3 text-dark">PHÁT HÀNH CÔNG VIỆC</button>
                </div>
                
                <!-- PHẦN 4: CHI TIẾT TOÀN BỘ -->
                <h5 class="text-white fw-bold mb-3"><i class="bi bi-list-nested me-2"></i>4. CHI TIẾT TOÀN BỘ CÔNG VIỆC</h5>
                <div id="allTasksContainer">Đang tải...</div>

                <!-- CHÈN THÊM PHẦN 5: BẢNG ĐIỂM DANH REALTIME -->
                <h5 class="text-success fw-bold mb-3 mt-5"><i class="bi bi-person-check-fill me-2"></i>5. TRẠNG THÁI ĐIỂM DANH HÔM NAY</h5>
                <div class="p-4 mb-5 rounded-4 shadow-sm" style="background: #1a1d20; border: 1px solid #2b3035;">
                    <div id="attendanceContainer" class="row g-3">
                        <!-- Danh sách điểm danh sẽ đổ vào đây -->
                    </div>
                </div>
            `;
            
            loadAllTasksAdmin();
            loadAttendanceAdmin(); // Gọi thêm hàm tải điểm danh
            setupAdminRealtime();
        }

        async function loadAllTasksAdmin() {
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            const { data: tasks } = await supabaseClient.from('employee_kpis')
                .select('*, task_assignees(employee_id, profiles(full_name)), subtasks(*)')
                .order('created_at', { ascending: false })
                .order('order_index', { foreignTable: 'subtasks', ascending: true }); // Ép subtasks sắp xếp cố định

            // ================= 1. XỬ LÝ BIỂU ĐỒ & CHỈ SỐ CÔNG TY =================
            if (tasks) {
                let total = tasks.length;
                let completed = tasks.filter(t => t.progress === 100).length;
                let inProgress = total - completed;

                document.getElementById('statTotalTasks').innerText = total;
                document.getElementById('statCompleted').innerText = completed;
                document.getElementById('statInProgress').innerText = inProgress;

                const ctxStatus = document.getElementById('statusChart').getContext('2d');
                if (statusChart) statusChart.destroy();
                statusChart = new Chart(ctxStatus, {
                    type: 'doughnut',
                    data: {
                        labels: ['Hoàn thành', 'Đang làm'],
                        datasets: [{ data: [completed, inProgress], backgroundColor: ['#10b981', '#f59e0b'], borderWidth: 0 }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } } }
                });

                let empTaskCount = {};
                tasks.forEach(t => {
                    if(t.task_assignees) {
                        t.task_assignees.forEach(a => {
                            let name = a.profiles.full_name;
                            empTaskCount[name] = (empTaskCount[name] || 0) + 1;
                        });
                    }
                });

                const ctxEmp = document.getElementById('employeeChart').getContext('2d');
                if (employeeChart) employeeChart.destroy();
                employeeChart = new Chart(ctxEmp, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(empTaskCount),
                        datasets: [{ label: 'Số lượng công việc', data: Object.values(empTaskCount), backgroundColor: '#0ea5e9', borderRadius: 4 }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        scales: { y: { ticks: { color: '#adb5bd', stepSize: 1 }, grid: { color: '#2b3035' } }, x: { ticks: { color: '#adb5bd' }, grid: { display: false } } },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            // ================= 2. XỬ LÝ TỔNG QUAN TỪNG NHÂN SỰ =================
            let empOverviewHtml = '';
            if (employees && employees.length > 0) {
                employees.forEach(emp => {
                    let myTasks = tasks ? tasks.filter(t => t.task_assignees.some(a => a.employee_id === emp.id)) : [];
                    let totalTasks = myTasks.length;
                    let completedTasks = myTasks.filter(t => t.progress === 100).length;
                    let empProgress = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

                    let miniTaskListHtml = '';
                    if (totalTasks === 0) {
                        miniTaskListHtml = '<div class="text-white-50 small">Chưa có công việc nào.</div>';
                    } else {
                        myTasks.forEach(t => {
                            miniTaskListHtml += `
                            <div class="mb-2 p-2 rounded d-flex justify-content-between align-items-center" style="background: rgba(0,0,0,0.3); border-left: 3px solid ${t.progress === 100 ? '#10b981' : '#0ea5e9'};">
                                <span class="text-white small fw-bold text-truncate me-2" style="max-width: 70%;" title="${t.task_name}">${t.task_name}</span>
                                <span class="badge bg-dark border border-secondary text-info progress-badge-${t.id}">${t.progress}%</span>
                            </div>`;
                        });
                    }

                    empOverviewHtml += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="p-3 rounded-4 shadow-sm h-100" style="background: #1a1d20; border: 1px solid #3f3f46;">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="text-warning fw-bold mb-0 fs-5"><i class="bi bi-person-badge-fill me-2"></i>${emp.full_name}</h6>
                                <span class="badge bg-secondary text-white">${completedTasks}/${totalTasks} Xong</span>
                            </div>
                            <div class="small text-white-50 mb-2">Hiệu suất tổng: ${empProgress}%</div>
                            <div class="progress mb-3" style="height: 5px;"><div class="progress-bar bg-success" style="width: ${empProgress}%"></div></div>
                            
                            <div class="p-2 rounded bg-dark border border-secondary" style="max-height: 150px; overflow-y: auto;">
                                ${miniTaskListHtml}
                            </div>
                        </div>
                    </div>`;
                });
            }
            document.getElementById('employeeOverviewContainer').innerHTML = empOverviewHtml;

            // ================= 3. CHI TIẾT CÔNG VIỆC & KHUNG CHAT ADMIN =================
            let allTasksHtml = '';
            if (!tasks || tasks.length === 0) allTasksHtml = '<p class="text-white-50">Chưa có công việc nào được tạo.</p>';
            else {
                tasks.forEach(t => {
                    let statusInfo = getDeadlineStatus(t.due_date, t.progress);
                    let assigneesStr = t.task_assignees.map(a => `<span class="badge bg-dark text-info border border-info me-1 fw-bold">👤 ${a.profiles.full_name}</span>`).join('');
                    
                    let subtasksHtml = t.subtasks.map(s => `
                        <div class="small text-white mb-2 d-flex justify-content-between align-items-center">
                            <span><i class="bi ${s.progress === 100 ? 'bi-check-circle-fill text-success' : 'bi-dash-circle text-warning'} me-2"></i>${s.title}</span>
                            <span class="badge bg-secondary">${s.progress || 0}%</span>
                        </div>
                    `).join('');
                    
                    allTasksHtml += `
                    <div class="p-3 mb-3 rounded-3 text-white shadow-sm" style="background: #1a1d20; border-left: 5px solid ${statusInfo.hex}; border: 1px solid #2b3035;">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="text-white fw-bold mb-0 fs-5 pe-3">${t.task_name}</h6>
                            <div class="d-flex gap-2 align-items-center">
                                <span class="badge bg-${statusInfo.color} fw-bold px-2 py-1 progress-badge-${t.id}">${t.progress}%</span>
                                <button onclick="editTask('${t.id}')" class="btn btn-sm btn-outline-info p-1 px-2" title="Sửa"><i class="bi bi-pencil"></i></button>
                                <button onclick="deleteTask('${t.id}')" class="btn btn-sm btn-outline-danger p-1 px-2" title="Xóa"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                        <div class="mb-2">${assigneesStr}</div>
                        <div class="small text-${statusInfo.color} fw-bold mb-3">
                            <i class="bi bi-clock-history me-1"></i> ${statusInfo.text} <br>
                            <span class="text-white-50 fw-normal">🏁 Hạn chót: ${t.due_date ? new Date(t.due_date).toLocaleString() : 'Không có'}</span>
                        </div>
                        <div class="p-2 rounded mb-2 bg-black bg-opacity-50 border border-secondary">${subtasksHtml || '<span class="text-muted small">Không có hạng mục chi tiết</span>'}</div>
                        
                        <!-- KHUNG TRAO ĐỔI DÀNH CHO ADMIN (ĐÃ CHÈN VÀO ĐÂY) -->
                        <div class="p-3 rounded bg-black bg-opacity-50 border border-secondary mt-3 mb-3">
                            <div class="text-info fw-bold small mb-2"><i class="bi bi-chat-dots-fill me-1"></i> TRAO ĐỔI VỚI NHÂN SỰ:</div>
                            <div id="comments_box_${t.id}" class="mb-2 custom-scrollbar" style="max-height: 120px; overflow-y: auto;"></div>
                            <div class="input-group input-group-sm">
                                <input type="text" id="comment_input_${t.id}" class="form-control text-white bg-dark border-secondary" placeholder="Nhập phản hồi, chỉ đạo cho nhân sự...">
                                <button onclick="sendTaskComment('${t.id}')" class="btn btn-outline-info fw-bold">GỬI</button>
                            </div>
                        </div>

                        <div class="progress mt-2" style="height: 6px;"><div class="progress-bar bg-${statusInfo.color} progress-bar-${t.id}" style="width: ${t.progress}%"></div></div>
                    </div>`;

                    // GỌI TẢI COMMENT NGẦM CHO ADMIN
                    setTimeout(() => loadTaskComments(t.id), 100);
                });
            }
            document.getElementById('allTasksContainer').innerHTML = allTasksHtml;
        }

            // Tải danh sách điểm danh trong ngày hôm nay
        async function loadAttendanceAdmin() {
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const { data: attendance } = await supabaseClient.from('attendance')
                .select('*')
                .gte('created_at', today.toISOString());

            let html = '';
            if (employees) {
                employees.forEach(emp => {
                    let checkInRecord = attendance ? attendance.find(a => a.employee_id === emp.id) : null;
                    if(checkInRecord) {
                        let time = new Date(checkInRecord.created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                        html += `
                        <div class="col-md-4 col-lg-3">
                            <div class="p-3 rounded-3 text-center border border-success" style="background: rgba(16, 185, 129, 0.1);">
                                <h6 class="text-white fw-bold mb-2 text-truncate">${emp.full_name}</h6>
                                <span class="badge bg-success w-100 py-2 fs-6"><i class="bi bi-check2-circle me-1"></i> Có mặt lúc ${time}</span>
                            </div>
                        </div>`;
                    } else {
                        html += `
                        <div class="col-md-4 col-lg-3">
                            <div class="p-3 rounded-3 text-center border border-secondary" style="background: rgba(255,255,255,0.02);">

       // Khai báo một biến để giữ đường truyền
        let myAdminChannel = null;

        // Thêm chữ "async" ở đầu hàm
        async function setupAdminRealtime() {
            // AWAIT TẠI ĐÂY LÀ CHÌA KHÓA: Đợi xóa sạch kết nối cũ rồi mới kết nối mới
            if (myAdminChannel) {
                await supabaseClient.removeChannel(myAdminChannel);
            } else {
                await supabaseClient.removeAllChannels();
            }

            myAdminChannel = supabaseClient.channel('admin-realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'employee_kpis' }, payload => {
                    let updated = payload.new;
                    
                    // 1. Ép nhảy số và thanh chạy trên giao diện giám đốc ngay lập tức (0 độ trễ)
                    let badges = document.querySelectorAll(`.progress-badge-${updated.id}`);
                    let bars = document.querySelectorAll(`.progress-bar-${updated.id}`);
                    badges.forEach(badge => badge.innerText = updated.progress + '%');
                    bars.forEach(bar => bar.style.width = updated.progress + '%');

                    // 2. Chạy ngầm tải lại biểu đồ và trạng thái hạng mục con
                    loadAllTasksAdmin(); 
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, payload => {
                    loadAttendanceAdmin(); 
                })
                .subscribe((status) => {
                    console.log("Trạng thái kết nối Realtime:", status);
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        // Thử kết nối lại nếu mạng của Admin bị rớt
                        setTimeout(() => myAdminChannel.subscribe(), 2000);
                    }
                });
        }

        // (Bạn có thể nhúng đoạn này vào thẻ <style> trên đầu file html nếu muốn)
        const customInputStyle = `

        async function assignProfessionalTask() {
            const taskName = document.getElementById('adminTaskName').value.trim();
            const startDate = document.getElementById('adminStartDate').value;
            const dueDate = document.getElementById('adminDueDate').value;
            const subtasksText = document.getElementById('adminSubtasks').value.trim();
            
            const selectedEmps = Array.from(document.querySelectorAll('.emp-checkbox:checked')).map(cb => cb.value);

            if (!taskName) return alert("Vui lòng nhập tên công việc!");
            if (selectedEmps.length === 0) return alert("Vui lòng chọn ít nhất một nhân viên thực hiện!");

            const { data: taskData, error: taskError } = await supabaseClient.from('employee_kpis').insert([{
                task_name: taskName,
                assigned_by: currentUser.id,
                start_date: startDate ? new Date(startDate).toISOString() : null,
                due_date: dueDate ? new Date(dueDate).toISOString() : null,
                progress: 0,
                status: 'Đang làm'
            }]).select().single();

            if (taskError) return alert("Lỗi tạo việc: " + taskError.message);
            const taskId = taskData.id;

            let assigneeRows = selectedEmps.map(empId => ({ task_id: taskId, employee_id: empId }));
            await supabaseClient.from('task_assignees').insert(assigneeRows);

            if (subtasksText) {
                let lines = subtasksText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                // Bổ sung order_index để đánh số thứ tự cố định từ trên xuống dưới
                let subtaskRows = lines.map((line, index) => ({ 
                    task_id: taskId, 
                    title: line, 
                    is_completed: false, 
                    progress: 0, 
                    order_index: index 
                }));
                await supabaseClient.from('subtasks').insert(subtaskRows);
            }

            alert("✅ Giao việc chuyên nghiệp thành công!");
            renderAdminView();

        async function loadMyProfessionalTasks() {

            // Lệnh sắp xếp order_index để cố định vị trí hạng mục
            const { data: tasks } = await supabaseClient.from('employee_kpis').select('*, subtasks(*)').in('id', taskIds).order('created_at', { ascending: false }).order('order_index', { foreignTable: 'subtasks', ascending: true });

                    </div>

                        <span class="text-white-50 fw-normal">🏁 Hạn chót: ${t.due_date ? new Date(t.due_date).toLocaleString() : 'Không có'}</span>

                        <div id="comments_box_${t.id}" class="mb-2 custom-scrollbar" style="max-height: 120px; overflow-y: auto;"></div>
                        <div class="input-group input-group-sm">
                            <input type="text" id="comment_input_${t.id}" class="form-control text-white bg-dark border-secondary" placeholder="Nhập giải trình lý do chậm, trao đổi...">

        // Tự động tính trung bình cộng các hạng mục lên thanh tiến độ chính
        async function updateSubtaskProgress(subtaskId, newProgressValue) {
            let pVal = parseInt(newProgressValue);
            
            // 1. Cập nhật tiến độ của chính hạng mục đó
            const { error: err1 } = await supabaseClient.from('subtasks').update({ progress: pVal, is_completed: pVal === 100 }).eq('id', subtaskId);
            if (err1) alert("Lỗi cập nhật hạng mục: " + err1.message);

            // 2. Kéo tất cả hạng mục của công việc này về để tính trung bình cộng
            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if (!subData) return;
            const taskId = subData.task_id;
            
            const { data: allSubs } = await supabaseClient.from('subtasks').select('progress').eq('task_id', taskId);
            
            if(allSubs && allSubs.length > 0) {
                let totalProgress = 0;
                allSubs.forEach(s => totalProgress += (s.progress || 0));
                let overallPercent = Math.round(totalProgress / allSubs.length); // Tính trung bình
                let status = overallPercent === 100 ? 'Hoàn thành' : 'Đang làm';

                // 3. Cập nhật tiến độ tổng thể của công việc
                const { error: err2 } = await supabaseClient.from('employee_kpis').update({ progress: overallPercent, status: status }).eq('id', taskId);
                if (err2) alert("Lỗi cập nhật tiến độ tổng: " + err2.message);
            }
            loadMyProfessionalTasks(); // Tải lại để cập nhật màu sắc
        }
                    // Gửi báo cáo định kỳ theo các mốc thời gian
        async function submitPeriodicReport(taskId) {
            let slot = document.getElementById(`slot_${taskId}`).value;
            let percent = parseInt(document.getElementById(`prog_${taskId}`).value);
            let note = document.getElementById(`note_${taskId}`).value.trim();

            if (isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập phần trăm hợp lệ từ 0 đến 100!");

            // 1. Lưu vào bảng lịch sử báo cáo định kỳ task_updates
            await supabaseClient.from('task_updates').insert([{
                task_id: taskId,
                employee_id: currentUser.id,
                time_slot: slot,
                progress_percent: percent,
                note: note
            }]);

            // 2. Cập nhật tiến độ tổng thể của công việc (Realtime sẽ tự động đẩy lên cho Admin)
            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);

            alert(`✅ Đã gửi báo cáo [${slot}] thành công! Giám đốc đã nhận được cập nhật.`);
            loadMyProfessionalTasks();
        }

        async function toggleSubtask(subtaskId, isChecked) {
            await supabaseClient.from('subtasks').update({ is_completed: isChecked }).eq('id', subtaskId);

            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if(!subData) return;
            const taskId = subData.task_id;

            const { data: allSubs } = await supabaseClient.from('subtasks').select('*').eq('task_id', taskId);
            if(allSubs && allSubs.length > 0) {
                let completedCount = allSubs.filter(s => s.is_completed).length;
                let percent = Math.round((completedCount / allSubs.length) * 100);
                let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';

                await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            }

            loadMyProfessionalTasks();
        }

        // Hàm cập nhật tiến độ (Nhân viên)
        async function updateProgress(taskId) {
            let percent = prompt("Nhập % hoàn thành công việc (Từ 0 đến 100):");
            if(percent === null || percent === '') return;
            
            percent = parseInt(percent);
            if(isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập số từ 0 đến 100");

            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            
            alert("✅ Đã cập nhật tiến độ!");
            loadMyTasks(); // Tải lại giao diện nhân viên
        }

        // ================= TÍNH NĂNG SỬA CÔNG VIỆC AN TOÀN =================
        async function editTask(taskId) {
            try {
                const { data, error } = await supabaseClient.from('employee_kpis').select('*').eq('id', taskId).single();
                if (error) throw error;
                
                if (data) {
                    document.getElementById('editTaskId').value = data.id;
                    document.getElementById('editTaskName').value = data.task_name;
                    
                    if (data.due_date) {
                        let d = new Date(data.due_date);
                        d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); 
                        document.getElementById('editTaskDue').value = d.toISOString().slice(0,16);
                    } else {
                        document.getElementById('editTaskDue').value = '';
                    }

                    // Mở bảng Sửa
                    document.getElementById('editModal').classList.remove('d-none');
                }
            } catch (err) {
                console.error("Lỗi nút sửa:", err);
                alert("Không thể tải thông tin công việc: " + err.message);
            }
        }

        async function saveEditTask() {
            let id = document.getElementById('editTaskId').value;
            let newName = document.getElementById('editTaskName').value.trim();
            let newDue = document.getElementById('editTaskDue').value;

            if (!newName) return alert("Tên công việc không được để trống!");

            const { error } = await supabaseClient.from('employee_kpis').update({
                task_name: newName,
                due_date: newDue ? new Date(newDue).toISOString() : null
            }).eq('id', id);

            if (error) {
                alert("❌ Lỗi khi lưu: " + error.message);
            } else {
                document.getElementById('editModal').classList.add('d-none');
                loadAllTasksAdmin(); 
            }
        }
    
        // Tải danh sách tin nhắn trao đổi của một công việc
        async function loadTaskComments(taskId) {
            const { data: comments } = await supabaseClient.from('task_comments')
                .select('*, profiles(full_name, role)')
                .eq('task_id', taskId)
                .order('created_at', { ascending: true });

            let container = document.getElementById(`comments_box_${taskId}`);
            if (!container) return;

            let html = '';
            if (comments && comments.length > 0) {
                comments.forEach(c => {
                    let isAdmin = c.profiles.role === 'admin';
                    let bgStyle = isAdmin ? 'background: rgba(14, 165, 233, 0.1); border-left: 3px solid #0ea5e9;' : 'background: rgba(255, 255, 255, 0.05); border-left: 3px solid #f59e0b;';
                    let timeStr = new Date(c.created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    
                    html += `
                    <div class="p-2 mb-2 rounded small" style="${bgStyle}">
                        <div class="d-flex justify-content-between text-white-50 mb-1" style="font-size: 0.75rem;">
                            <span class="fw-bold ${isAdmin ? 'text-info' : 'text-warning'}">${c.profiles.full_name} (${isAdmin ? 'Giám đốc' : 'Nhân sự'})</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="text-white">${c.message}</div>
                    </div>`;
                });
            } else {
                html += '<div class="text-muted small fst-italic mb-2">Chưa có trao đổi nào. Hãy để lại giải trình hoặc phản hồi tại đây...</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight; // Cuộn xuống tin nhắn mới nhất
        }

        // Gửi tin nhắn giải trình/phản hồi
        async function sendTaskComment(taskId) {
            let inputElem = document.getElementById(`comment_input_${taskId}`);
            let messageText = inputElem.value.trim();
            if (!messageText) return;

            const { error } = await supabaseClient.from('task_comments').insert([{
                task_id: taskId,
                sender_id: currentUser.id,
                message: messageText
            }]);

            if (error) {
                alert("Lỗi gửi tin nhắn: " + error.message);
            } else {
                inputElem.value = '';
                loadTaskComments(taskId); // Tải lại khung chat ngay lập tức
            }
        }
