    <style>
        /* Khóa cuộn ngang chống vỡ giao diện, cho phép cuộn dọc tự nhiên nếu cần */
        body { background-color: #000; overflow-x: hidden; margin: 0; color: #fff; }
        
        .nav-menu-btn { transition: all 0.2s ease-in-out; }

        /* MENU MOBILE 1 DÒNG SIÊU GỌN */
        @media (max-width: 767px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
            .nav-menu-text { display: none; }
            
            /* Nút bình thường trên Mobile */
            .nav-menu-btn { background: transparent !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px; font-size: 1.1rem; opacity: 1 !important; }
            
            #headerTitle { font-size: 0.7rem !important; white-space: normal !important; overflow: visible !important; line-height: 1.3; text-align: left; }
        }

        /* MÀU NÚT MENU ĐANG CHỌN (ĐẶT Ở DƯỚI CÙNG ĐỂ GHI ĐÈ TUYỆT ĐỐI TRÊN MỌI THIẾT BỊ) */
        .nav-menu-btn.active-nav { background: #0ea5e9 !important; color: #000 !important; border-color: #0ea5e9 !important; opacity: 1 !important; }

        /* Ẩn thanh cuộn tàng hình */
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Style cho thẻ KPI */
        .kpi-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .progress-thin { height: 6px; background-color: #333; border-radius: 10px; margin-top: 8px; }

        /* GIAO DIỆN THẺ THỐNG KÊ CHUYÊN NGHIỆP (GLASSMORPHISM) */
        .stat-card { background: #1a1d20; border: 1px solid #2b3035; border-radius: 16px; padding: 20px; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: #3f3f46; }

        .dynamic-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #2b3035; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        // HÀM CHUẨN HÓA NGÀY THÁNG VN (DD/MM/YYYY HH:MM)
        function formatDateVN(dateStr) {
            if (!dateStr) return 'Không có';
            let d = new Date(dateStr);
            let day = d.getDate().toString().padStart(2, '0');
            let month = (d.getMonth() + 1).toString().padStart(2, '0');
            let year = d.getFullYear();
            let hrs = d.getHours().toString().padStart(2, '0');
            let mins = d.getMinutes().toString().padStart(2, '0');
            return `${day}/${month}/${year} ${hrs}:${mins}`;
        }

        // Tự động tính toán màu sắc dựa trên Hạn chót
        function getDeadlineStatus(dueDateStr, progress) {
            if (progress === 100) return { color: 'success', hex: '#10b981', text: 'Đã hoàn thành' }; // Xanh lá
            if (!dueDateStr) return { color: 'info', hex: '#0ea5e9', text: 'Đang thực hiện' }; // Xanh dương (Không có hạn)

            let due = new Date(dueDateStr).getTime();
            let now = new Date().getTime();
            let hoursLeft = (due - now) / (1000 * 60 * 60);

            if (hoursLeft < 0) return { color: 'danger', hex: '#ef4444', text: 'QUÁ HẠN' }; // Đỏ
            if (hoursLeft <= 24) return { color: 'warning', hex: '#f59e0b', text: 'SẮP ĐẾN HẠN' }; // Vàng
            return { color: 'success', hex: '#10b981', text: 'Trong thời hạn' }; // Xanh lá
        }

        // HÀM ĐÓNG/MỞ CHI TIẾT CÔNG VIỆC
        function toggleTaskBody(taskId) {
            let body = document.getElementById(`taskBody_${taskId}`);
            let icon = document.getElementById(`icon_${taskId}`);
            if (body.classList.contains('d-none')) {
                body.classList.remove('d-none');
                icon.classList.replace('bi-chevron-down', 'bi-chevron-up');
            } else {
                body.classList.add('d-none');

            }
        }
        async function loadAllTasksAdmin() {
            const { data: employees } = await supabaseClient.from('profiles').select('*').eq('role', 'employee');
            const { data: tasks } = await supabaseClient.from('employee_kpis')
                .select('*, task_assignees(employee_id, profiles(full_name)), subtasks(*)')
                .order('created_at', { ascending: false })
                .order('order_index', { foreignTable: 'subtasks', ascending: true }); // Ép subtasks sắp xếp cố định

            // ================= 1. XỬ LÝ BIỂU ĐỒ & CHỈ SỐ CÔNG TY =================
            if (tasks) {
                let total = tasks.length;
                let completed = tasks.filter(t => t.progress === 100).length;
                let inProgress = total - completed;

                document.getElementById('statTotalTasks').innerText = total;
                document.getElementById('statCompleted').innerText = completed;
                document.getElementById('statInProgress').innerText = inProgress;

                // Chuẩn hóa font chữ và màu xám cho toàn bộ biểu đồ
                Chart.defaults.color = '#94a3b8';
                Chart.defaults.font.family = "'Segoe UI', Roboto, sans-serif";
                Chart.defaults.scale.grid.color = 'rgba(255, 255, 255, 0.05)';

                // Biểu đồ 1: Tỉ lệ hoàn thành (Khoét lỗ hiện đại, bo góc)
                const ctxStatus = document.getElementById('statusChart').getContext('2d');
                if (statusChart) statusChart.destroy();
                statusChart = new Chart(ctxStatus, {
                    type: 'doughnut',
                    data: {
                        labels: ['Xong', 'Đang làm'],
                        datasets: [{ 
                            data: [completed, inProgress], 
                            backgroundColor: ['#10b981', '#f59e0b'],
                            borderColor: '#1a1d20', // Màu viền khớp với nền card
                            borderWidth: 3, borderRadius: 5
                        }]
                    },
                    options: { cutout: '75%', maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } } }
                });

                // Biểu đồ 2: Phân bổ công việc (Dạng thanh ngang dễ đọc tên)
                let empNames = [];
                let empTaskData = [];
                employees.forEach(e => {
                    let count = tasks.filter(t => t.task_assignees.some(a => a.employee_id === e.id)).length;
                    empNames.push(e.full_name);
                    empTaskData.push(count);
                });

                const ctxEmp = document.getElementById('employeeChart').getContext('2d');
                if (employeeChart) employeeChart.destroy();
                employeeChart = new Chart(ctxEmp, {
                    type: 'bar',
                    data: {
                        labels: empNames,
                        datasets: [{
                            label: 'Số công việc', data: empTaskData,
                            backgroundColor: 'rgba(14, 165, 233, 0.8)', borderColor: '#0ea5e9', borderWidth: 1, borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y', // Biến thành thanh ngang
                        maintainAspectRatio: false,
                        scales: { 
                            x: { beginAtZero: true, ticks: { stepSize: 1 } },
                            y: { grid: { display: false } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });

                // Biểu đồ 3: Điểm danh tháng này (Đã fix lỗi đếm trùng ngày)
                const today = new Date();

        // Thêm chữ "async" ở đầu hàm
        async function setupAdminRealtime() {
            // AWAIT TẠI ĐÂY LÀ CHÌA KHÓA: Đợi xóa sạch kết nối cũ rồi mới kết nối mới
            if (myAdminChannel) {
                await supabaseClient.removeChannel(myAdminChannel);
            } else {
                await supabaseClient.removeAllChannels();
            }

            myAdminChannel = supabaseClient.channel('admin-realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'employee_kpis' }, payload => {
                    let updated = payload.new;
                    
                    // 1. Ép nhảy số và thanh chạy trên giao diện giám đốc ngay lập tức (0 độ trễ)
                    let badges = document.querySelectorAll(`.progress-badge-${updated.id}`);
                    let bars = document.querySelectorAll(`.progress-bar-${updated.id}`);
                    badges.forEach(badge => badge.innerText = updated.progress + '%');
                    bars.forEach(bar => bar.style.width = updated.progress + '%');

                    // 2. Chạy ngầm tải lại biểu đồ và trạng thái hạng mục con
                    loadAllTasksAdmin(); 
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, payload => {
                    loadAttendanceAdmin(); 
                })
                .subscribe((status) => {
                    console.log("Trạng thái kết nối Realtime:", status);
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        // Thử kết nối lại nếu mạng của Admin bị rớt
                        setTimeout(() => myAdminChannel.subscribe(), 2000);
                    }
                });
        }

        // Tự động tính trung bình cộng các hạng mục lên thanh tiến độ chính
        async function updateSubtaskProgress(subtaskId, newProgressValue) {
            let pVal = parseInt(newProgressValue);
            
            // 1. Cập nhật tiến độ của chính hạng mục đó
            const { error: err1 } = await supabaseClient.from('subtasks').update({ progress: pVal, is_completed: pVal === 100 }).eq('id', subtaskId);
            if (err1) alert("Lỗi cập nhật hạng mục: " + err1.message);

            // 2. Kéo tất cả hạng mục của công việc này về để tính trung bình cộng
            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if (!subData) return;
            const taskId = subData.task_id;
            
            const { data: allSubs } = await supabaseClient.from('subtasks').select('progress').eq('task_id', taskId);
            
            if(allSubs && allSubs.length > 0) {
                let totalProgress = 0;
                allSubs.forEach(s => totalProgress += (s.progress || 0));
                let overallPercent = Math.round(totalProgress / allSubs.length); // Tính trung bình
                let status = overallPercent === 100 ? 'Hoàn thành' : 'Đang làm';

                // 3. Cập nhật tiến độ tổng thể của công việc
                const { error: err2 } = await supabaseClient.from('employee_kpis').update({ progress: overallPercent, status: status }).eq('id', taskId);
                if (err2) alert("Lỗi cập nhật tiến độ tổng: " + err2.message);
            }
            loadMyProfessionalTasks(); // Tải lại để cập nhật màu sắc
        }

        // HÀM ĐỔI MÀU THANH KÉO NGAY KHI ĐANG LƯỚT TAY
        function updateSliderUI(slider, id) {
            let val = parseInt(slider.value);
            document.getElementById(`sub_val_${id}`).innerText = val + '%';
            
            let color = '#0ea5e9'; // Xanh dương (Mặc định)
            if (val === 100) color = '#10b981'; // Xanh lá (Hoàn thành)
            else if (val <= 30) color = '#ef4444'; // Đỏ (Mới bắt đầu/Chậm trễ)
            else if (val <= 60) color = '#f59e0b'; // Vàng (Đang làm)

            // Đổ màu gradient: Phần đã kéo có màu, phần chưa kéo màu xám đen
            slider.style.background = `linear-gradient(to right, ${color} ${val}%, #2b3035 ${val}%)`;
        }

            let slot = document.getElementById(`slot_${taskId}`).value;
            let percent = parseInt(document.getElementById(`prog_${taskId}`).value);
            let note = document.getElementById(`note_${taskId}`).value.trim();

            if (isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập phần trăm hợp lệ từ 0 đến 100!");

            // 1. Lưu vào bảng lịch sử báo cáo định kỳ task_updates
            await supabaseClient.from('task_updates').insert([{
                task_id: taskId,
                employee_id: currentUser.id,
                time_slot: slot,
                progress_percent: percent,
                note: note
            }]);

            // 2. Cập nhật tiến độ tổng thể của công việc (Realtime sẽ tự động đẩy lên cho Admin)
            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);

            alert(`✅ Đã gửi báo cáo [${slot}] thành công! Giám đốc đã nhận được cập nhật.`);
            loadMyProfessionalTasks();
        }

        async function toggleSubtask(subtaskId, isChecked) {
            await supabaseClient.from('subtasks').update({ is_completed: isChecked }).eq('id', subtaskId);

            const { data: subData } = await supabaseClient.from('subtasks').select('task_id').eq('id', subtaskId).single();
            if(!subData) return;
            const taskId = subData.task_id;

            const { data: allSubs } = await supabaseClient.from('subtasks').select('*').eq('task_id', taskId);
            if(allSubs && allSubs.length > 0) {
                let completedCount = allSubs.filter(s => s.is_completed).length;
                let percent = Math.round((completedCount / allSubs.length) * 100);
                let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';

                await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            }

            loadMyProfessionalTasks();
        }

        // ================= GIAO DIỆN NHÂN VIÊN CHUYÊN NGHIỆP =================
        function renderEmployeeView() {
            document.getElementById('employeeView').classList.remove('d-none');
            
            document.getElementById('employeeKpiList').innerHTML = `
                <h6 class="text-info fw-bold mb-3"><i class="bi bi-journal-check me-2"></i>CÔNG VIỆC ĐƯỢC GIAO CỦA TÔI</h6>
                <div id="myTasksContainer">Đang tải công việc...</div>
            `;
            
            loadMyProfessionalTasks();
            checkAttendanceStatus(); // Kiểm tra xem hôm nay điểm danh chưa để vẽ nút bấm
        }

        async function checkAttendanceStatus() {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const { data } = await supabaseClient.from('attendance')
                .select('*')
                .eq('employee_id', currentUser.id)
                .gte('created_at', today.toISOString())
                .limit(1);

            let topBtn = document.getElementById('topCheckInBtn');
            if(!topBtn) return; // Tránh lỗi nếu chưa load xong giao diện
            
            if(data && data.length > 0) {
                let time = new Date(data[0].created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                topBtn.className = "btn btn-sm nav-menu-btn fw-bold text-nowrap btn-success text-white border-success opacity-100";
                topBtn.disabled = true;
                topBtn.innerHTML = `<i class="bi bi-check-circle-fill"></i><span class="nav-menu-text ms-1">${time}</span>`;
            } else {
                topBtn.className = "btn btn-sm nav-menu-btn fw-bold text-nowrap btn-outline-success text-success border-success opacity-100";
                topBtn.disabled = false;
                topBtn.innerHTML = `<i class="bi bi-geo-alt-fill"></i><span class="nav-menu-text ms-1">ĐIỂM DANH</span>`;
            }
        }

        async function checkIn() {
            const { error } = await supabaseClient.from('attendance').insert([{ employee_id: currentUser.id }]);
            if(error) alert("❌ Điểm danh lỗi: " + error.message);
            else {
                checkAttendanceStatus(); // Đổi màu nút thành xanh lá ngay lập tức
            }
        }

        // Hàm cập nhật tiến độ (Nhân viên)
        async function updateProgress(taskId) {
            let percent = prompt("Nhập % hoàn thành công việc (Từ 0 đến 100):");
            if(percent === null || percent === '') return;
            
            percent = parseInt(percent);
            if(isNaN(percent) || percent < 0 || percent > 100) return alert("Vui lòng nhập số từ 0 đến 100");

            let status = percent === 100 ? 'Hoàn thành' : 'Đang làm';
            await supabaseClient.from('employee_kpis').update({ progress: percent, status: status }).eq('id', taskId);
            
            alert("✅ Đã cập nhật tiến độ!");
            loadMyTasks(); // Tải lại giao diện nhân viên
        }

        async function handleLogout() {
            // 4. Dùng supabaseClient
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }
    // ================= TÍNH NĂNG XÓA CÔNG VIỆC BẰNG GIAO DIỆN MỚI =================
        function deleteTask(taskId) {
            // Hiển thị cái bảng màu đỏ đẹp thay vì alert xấu xí
            document.getElementById('deleteTaskId').value = taskId;
            document.getElementById('deleteModal').classList.remove('d-none');
        }

        async function confirmDeleteTask() {
            let taskId = document.getElementById('deleteTaskId').value;
            const { error } = await supabaseClient.from('employee_kpis').delete().eq('id', taskId);
            
            if (error) {
                alert("❌ Lỗi khi xóa: " + error.message);
            } else {
                document.getElementById('deleteModal').classList.add('d-none');
                loadAllTasksAdmin(); // Tải lại trang sau khi xóa
            }
        }

        // Tải danh sách tin nhắn trao đổi của một công việc
        async function loadTaskComments(taskId) {
            const { data: comments } = await supabaseClient.from('task_comments')
                .select('*, profiles(full_name, role)')
                .eq('task_id', taskId)
                .order('created_at', { ascending: true });

            let container = document.getElementById(`comments_box_${taskId}`);
            if (!container) return;

            let html = '';
            if (comments && comments.length > 0) {
                comments.forEach(c => {
                    let isAdmin = ['admin', 'pho_giam_doc', 'truong_phong', 'pho_phong'].includes(c.profiles.role);
                    let bgStyle = isAdmin ? 'background: rgba(14, 165, 233, 0.1); border-left: 3px solid #0ea5e9;' : 'background: rgba(255, 255, 255, 0.05); border-left: 3px solid #f59e0b;';
                    let timeStr = formatDateVN(c.created_at); // Đổi sang ngày tháng full
                    
                    html += `
                    <div class="p-2 mb-2 rounded small" style="${bgStyle}">
                        <div class="d-flex justify-content-between text-white-50 mb-1" style="font-size: 0.75rem;">
                            <span class="fw-bold ${isAdmin ? 'text-info' : 'text-warning'}">${c.profiles.full_name} (${isAdmin ? 'Giám đốc' : 'Nhân sự'})</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="text-white">${c.message}</div>
                    </div>`;
                });
            } else {
                html += '<div class="text-muted small fst-italic mb-2">Chưa có trao đổi nào. Hãy để lại giải trình hoặc phản hồi tại đây...</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight; // Cuộn xuống tin nhắn mới nhất
        }

        // Gửi tin nhắn giải trình/phản hồi
        async function sendTaskComment(taskId) {
            let inputElem = document.getElementById(`comment_input_${taskId}`);
            let messageText = inputElem.value.trim();
            if (!messageText) return;

            const { error } = await supabaseClient.from('task_comments').insert([{
                task_id: taskId,
                sender_id: currentUser.id,
                message: messageText
            }]);

            if (error) {
                alert("Lỗi gửi tin nhắn: " + error.message);
            } else {
                inputElem.value = '';
                loadTaskComments(taskId); // Tải lại khung chat ngay lập tức
            }
        }
    </script>
