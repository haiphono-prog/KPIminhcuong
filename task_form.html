<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xử lý Công việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- THƯ VIỆN LỊCH FLATPICKR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <style>
        body { background-color: #000; overflow-x: hidden; margin: 0; color: #fff; }
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-input { background-color: #121416 !important; border: 1px solid #3f3f46 !important; color: #ffffff !important; border-radius: 8px; padding: 12px 15px; font-weight: 500; }
        .custom-input:focus { border-color: #0ea5e9 !important; box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25) !important; }

        .nav-menu-btn.active-nav { background-color: #0ea5e9 !important; color: #000 !important; border-color: #0ea5e9 !important; opacity: 1 !important; }
        .nav-menu-btn { transition: all 0.2s; }

        @media (max-width: 767px) {
            .nav-menu-text { display: none; }
            .nav-menu-btn { background: transparent !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px; font-size: 1.1rem; opacity: 1 !important; }
            #headerTitle { font-size: 0.7rem !important; white-space: normal !important; overflow: visible !important; line-height: 1.3; text-align: left; }
        }
    </style>
</head>
<body>
    <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column animate__animated animate__fadeIn" style="background: #000; z-index: 99999; overflow-x: hidden;">
        
        <!-- HEADER -->
        <div class="d-flex p-2 border-bottom border-secondary bg-dark align-items-center sticky-top justify-content-between shadow-sm flex-shrink-0" style="z-index: 1020; padding-top: max(env(safe-area-inset-top), 0.5rem) !important;">
            <div class="d-flex align-items-center overflow-hidden pe-1">
                <button onclick="window.location.href='dashboard.html'" class="btn btn-sm text-white-50 p-1 bg-transparent border-0 shadow-none me-1" title="Quay lại"><i class="bi bi-arrow-left fs-4"></i></button>
                <div class="text-info fw-bold" id="headerTitle" style="font-size: 1rem; line-height: 1.2;">ĐANG TẢI...</div>
            </div>
            <div class="d-flex gap-1 gap-md-2 flex-shrink-0">
                <button onclick="window.location.href='dashboard.html'" class="btn btn-sm nav-menu-btn btn-outline-light fw-bold text-nowrap"><i class="bi bi-house-door"></i><span class="nav-menu-text ms-1">TỔNG QUAN</span></button>
                <button onclick="window.location.href='task_form.html'" class="btn btn-sm active-nav nav-menu-btn fw-bold text-nowrap"><i class="bi bi-clipboard-plus"></i><span class="nav-menu-text ms-1">GIAO VIỆC</span></button>
                <button onclick="window.location.href='accounts.html'" class="btn btn-sm nav-menu-btn btn-outline-light fw-bold text-nowrap"><i class="bi bi-people"></i><span class="nav-menu-text ms-1">PHÂN QUYỀN</span></button>
                <button onclick="window.location.href='attendance.html'" class="btn btn-sm nav-menu-btn btn-outline-light fw-bold text-nowrap"><i class="bi bi-calendar-check"></i><span class="nav-menu-text ms-1">CHẤM CÔNG</span></button>
            </div>
        </div>

        <div class="flex-grow-1 overflow-auto custom-scrollbar p-0">
            <div class="p-3 w-100 mx-auto" style="max-width: 800px;">
                <h4 id="pageTitle" class="text-info fw-bold mb-4"><i class="bi bi-journal-plus me-2"></i>TẠO CÔNG VIỆC MỚI</h4>
                <input type="hidden" id="taskId">
                
                <div class="mb-4">
                    <label class="fw-bold small mb-2 text-info">TÊN CÔNG VIỆC</label>
                    <input type="text" id="taskName" class="form-control custom-input" placeholder="Nhập tên công việc rõ ràng...">
                </div>
                
                <div class="row mb-2">
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold small mb-2 text-info">NGÀY BẮT ĐẦU</label>
                        <input type="datetime-local" id="startDate" class="form-control custom-input">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold small mb-2 text-warning">CỘNG THÊM (NGÀY)</label>
                        <div class="input-group">
                            <input type="number" id="addDays" class="form-control custom-input border-end-0" placeholder="VD: 5" min="0">
                            <button class="btn btn-outline-warning fw-bold border-start-0" type="button" onclick="calculateDueDate()">TÍNH</button>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold small mb-2 text-danger">HẠN CHÓT</label>
                        <input type="datetime-local" id="dueDate" class="form-control custom-input">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="fw-bold small mb-2 text-info">NHÂN SỰ THỰC HIỆN</label>
                    <div id="employeeList" class="p-3 rounded-3 custom-scrollbar" style="background: #121416; border: 1px solid #3f3f46; max-height: 200px; overflow-y: auto;">Đang tải...</div>
                </div>

                <!-- KHU VỰC QUẢN LÝ HẠNG MỤC -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-end mb-2">
                        <label class="fw-bold small text-info mb-0">HẠNG MỤC CÔNG VIỆC</label>
                        <button type="button" onclick="addEmptySubtaskLine()" class="btn btn-sm btn-outline-info rounded-pill px-3 py-1 fw-bold"><i class="bi bi-plus-lg me-1"></i>Thêm dòng</button>
                    </div>
                    <div id="subtaskContainer" class="p-3 rounded-3" style="background: #121416; border: 1px solid #3f3f46;">
                        <!-- Các hạng mục sẽ được sinh ra ở đây -->
                    </div>
                </div>

                <div id="editLogSection" class="d-none mb-4">
                    <label class="fw-bold small mb-2 text-warning"><i class="bi bi-exclamation-triangle-fill me-1"></i>NHẬT KÝ SỬA ĐỔI</label>
                    <input type="text" id="editNote" class="form-control custom-input border-warning" placeholder="Nhập lý do thay đổi công việc...">
                </div>

                <button id="submitBtn" onclick="saveTask()" class="btn btn-info w-100 fw-bold py-3 mt-2 text-dark fs-5 shadow-lg mb-5">PHÁT HÀNH CÔNG VIỆC</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let isEditMode = false;
        let fpStart, fpDue; 
        
        let subtaskCount = 0; // Biến đếm số lượng hạng mục đang hiển thị trên form

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = "index.html";
            currentUser = session.user;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if(profile) document.getElementById('headerTitle').innerText = profile.full_name.toUpperCase();

            const fpConfig = { 
                enableTime: true, time_24hr: true, locale: "vn",
                dateFormat: "Y-m-d\\TH:i", altInput: true, altFormat: "d/m/Y H:i"
            };
            fpStart = flatpickr("#startDate", fpConfig);
            fpDue = flatpickr("#dueDate", fpConfig);

            let now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            fpStart.setDate(now.toISOString().slice(0,16));

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('id');

            if (editId) { 
                isEditMode = true; 
                setupEditMode(editId); 
            } else { 
                setupCreateMode(); 
            }
        });

        function calculateDueDate() {
            let startVal = document.getElementById('startDate').value;
            let days = parseFloat(document.getElementById('addDays').value);
            if(!startVal || isNaN(days)) return alert("Vui lòng chọn ngày bắt đầu và nhập số ngày!");
            
            let d = new Date(startVal);
            d.setDate(d.getDate() + days);
            fpDue.setDate(d.toISOString().slice(0,16));
        }

        // --- QUẢN LÝ HẠNG MỤC TRÊN GIAO DIỆN FORM ---
        function addEmptySubtaskLine(id = '', title = '', progress = 0) {
            subtaskCount++;
            const container = document.getElementById('subtaskContainer');
            
            const div = document.createElement('div');
            div.className = 'd-flex align-items-center mb-2 animate__animated animate__fadeIn';
            div.id = `row_subtask_${subtaskCount}`;
            
            // Nếu là dòng có id thực từ DB, ta giấu id vào input hidden, hiện % báo cáo
            let badgeHtml = '';
            if (id) {
                let colorClass = progress === 100 ? 'bg-success' : (progress > 0 ? 'bg-warning' : 'bg-secondary');
                badgeHtml = `<span class="badge ${colorClass} ms-2" style="width: 50px;">${progress}%</span>`;
            }

            div.innerHTML = `
                <input type="hidden" class="st-id" value="${id}">
                <input type="hidden" class="st-progress" value="${progress}">
                <div class="input-group">
                    <span class="input-group-text bg-dark text-white-50 border-secondary"><i class="bi bi-list-task"></i></span>
                    <input type="text" class="form-control custom-input border-start-0 st-title" placeholder="Tên hạng mục chi tiết..." value="${title}">
                    <button type="button" onclick="removeSubtaskLine('${div.id}')" class="btn btn-outline-danger border-secondary" title="Xóa dòng"><i class="bi bi-trash"></i></button>
                </div>
                ${badgeHtml}
            `;
            container.appendChild(div);
        }

        function removeSubtaskLine(rowId) {
            document.getElementById(rowId).remove();
        }

        // --- KHỞI TẠO CHẾ ĐỘ TẠO MỚI ---
        async function setupCreateMode() {
            document.getElementById('pageTitle').innerHTML = "<i class='bi bi-journal-plus me-2'></i>TẠO CÔNG VIỆC MỚI";
            const { data: employees } = await supabaseClient.from('profiles').select('*').in('role', ['employee', 'pho_phong', 'truong_phong']).order('full_name', { ascending: true });
            
            let empHtml = employees ? employees.map(e => `
                <div class="form-check text-white mb-2 d-flex align-items-center">
                    <input class="form-check-input emp-checkbox me-2" type="checkbox" value="${e.id}" id="emp_${e.id}" style="width: 18px; height: 18px;">
                    <label class="form-check-label fw-bold fs-6" for="emp_${e.id}">${e.full_name}</label>
                </div>`).join('') : 'Không có dữ liệu';
            document.getElementById('employeeList').innerHTML = empHtml;

            // Giao diện Tạo mới: Cho sẵn 3 dòng trống để nhập
            addEmptySubtaskLine(); addEmptySubtaskLine(); addEmptySubtaskLine();
        }

        // --- KHỞI TẠO CHẾ ĐỘ CHỈNH SỬA (KÉO TOÀN BỘ DATA CŨ LÊN) ---
        async function setupEditMode(id) {
            document.getElementById('pageTitle').innerHTML = "<i class='bi bi-pencil-square me-2 text-warning'></i>CHỈNH SỬA CÔNG VIỆC";
            document.getElementById('submitBtn').innerText = "CẬP NHẬT CÔNG VIỆC";
            document.getElementById('submitBtn').classList.replace('btn-info', 'btn-warning');
            document.getElementById('editLogSection').classList.remove('d-none'); 

            // 1. Kéo dữ liệu Công việc gốc
            const { data: task } = await supabaseClient.from('employee_kpis').select('*').eq('id', id).single();
            if (task) {
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskName').value = task.task_name;
                
                if (task.start_date) {
                    let sd = new Date(task.start_date); sd.setMinutes(sd.getMinutes() - sd.getTimezoneOffset());
                    fpStart.setDate(sd.toISOString().slice(0,16));
                }
                if (task.due_date) {
                    let dd = new Date(task.due_date); dd.setMinutes(dd.getMinutes() - dd.getTimezoneOffset());
                    fpDue.setDate(dd.toISOString().slice(0,16));
                }
            }

            // 2. Kéo danh sách Nhân sự, tick sẵn những người đang làm
            const { data: assignedEmps } = await supabaseClient.from('task_assignees').select('employee_id').eq('task_id', id);
            let assignedIds = assignedEmps ? assignedEmps.map(a => a.employee_id) : [];

            const { data: employees } = await supabaseClient.from('profiles').select('*').in('role', ['employee', 'pho_phong', 'truong_phong']).order('full_name', { ascending: true });
            let empHtml = employees ? employees.map(e => {
                let isChecked = assignedIds.includes(e.id) ? 'checked' : '';
                return `
                <div class="form-check text-white mb-2 d-flex align-items-center">
                    <input class="form-check-input emp-checkbox me-2" type="checkbox" value="${e.id}" id="emp_${e.id}" style="width: 18px; height: 18px;" ${isChecked}>
                    <label class="form-check-label fw-bold fs-6" for="emp_${e.id}">${e.full_name}</label>
                </div>`;
            }).join('') : 'Không có dữ liệu';
            document.getElementById('employeeList').innerHTML = empHtml;

            // 3. Kéo danh sách Hạng mục cũ hiển thị lên form
            const { data: subtasks } = await supabaseClient.from('subtasks').select('*').eq('task_id', id).order('order_index', { ascending: true });
            if (subtasks && subtasks.length > 0) {
                subtasks.forEach(sub => {
                    addEmptySubtaskLine(sub.id, sub.title, sub.progress || 0);
                });
            } else {
                addEmptySubtaskLine(); // Chừa 1 dòng trống nếu k có gì
            }
        }

        // --- LƯU THAY ĐỔI (XỬ LÝ LOGIC CỰC MẠNH) ---
        async function saveTask() {
            const name = document.getElementById('taskName').value.trim();
            const start = document.getElementById('startDate').value;
            const due = document.getElementById('dueDate').value;

            if (!name) return alert("Vui lòng nhập tên công việc!");
            
            const selectedEmps = Array.from(document.querySelectorAll('.emp-checkbox:checked')).map(cb => cb.value);
            if (selectedEmps.length === 0) return alert("Vui lòng chọn nhân viên thực hiện!");

            // Thu thập dữ liệu hạng mục từ các ô input hiện tại trên màn hình
            let currentSubtasks = [];
            let rows = document.getElementById('subtaskContainer').children;
            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                let id = row.querySelector('.st-id').value;
                let title = row.querySelector('.st-title').value.trim();
                let progress = parseInt(row.querySelector('.st-progress').value) || 0;
                
                if (title) { // Bỏ qua các dòng trống chưa gõ chữ
                    currentSubtasks.push({ id: id, title: title, progress: progress, order_index: i });
                }
            }

            // GIAO DIỆN EDIT (CẬP NHẬT)
            if (isEditMode) {
                const taskId = document.getElementById('taskId').value;
                const note = document.getElementById('editNote').value.trim();
                if (!note) return alert("Giám đốc vui lòng nhập lý do (Nhật ký) cho sự thay đổi này!");

                // 1. Cập nhật thông tin gốc
                await supabaseClient.from('employee_kpis').update({ task_name: name, start_date: start ? new Date(start).toISOString() : null, due_date: due ? new Date(due).toISOString() : null }).eq('id', taskId);

                // 2. Cập nhật Nhân sự (Xóa sạch cũ, thêm lại mới)
                await supabaseClient.from('task_assignees').delete().eq('task_id', taskId);
                let assigneeRows = selectedEmps.map(empId => ({ task_id: taskId, employee_id: empId }));
                await supabaseClient.from('task_assignees').insert(assigneeRows);

                // 3. Xử lý Hạng mục (Cập nhật cái cũ, Thêm cái mới. Những cái bị xóa trên màn hình sẽ bị bỏ qua)
                // Xóa toàn bộ hạng mục cũ trong DB
                await supabaseClient.from('subtasks').delete().eq('task_id', taskId);
                
                let subtaskInsertData = currentSubtasks.map(s => ({
                    task_id: taskId, title: s.title, progress: s.progress, is_completed: s.progress === 100, order_index: s.order_index
                }));
                // Bơm lại dữ liệu chuẩn xác lên CSDL
                if(subtaskInsertData.length > 0) {
                    await supabaseClient.from('subtasks').insert(subtaskInsertData);
                }

                // 4. Tính toán lại % tổng của công việc
                let totalProgress = 0;
                currentSubtasks.forEach(s => totalProgress += s.progress);
                let overallPercent = currentSubtasks.length > 0 ? Math.round(totalProgress / currentSubtasks.length) : 0;
                let newStatus = overallPercent === 100 ? 'Hoàn thành' : 'Đang làm';
                await supabaseClient.from('employee_kpis').update({ progress: overallPercent, status: newStatus }).eq('id', taskId);

                // 5. Ghi Log
                await supabaseClient.from('task_edit_logs').insert([{ task_id: taskId, edited_by: currentUser.id, edit_note: note }]);
                
                alert("✅ Sửa và đồng bộ công việc thành công!");
                window.location.href = 'dashboard.html';

            // GIAO DIỆN CREATE (TẠO MỚI)
            } else {
                const { data: taskData, error } = await supabaseClient.from('employee_kpis').insert([{
                    task_name: name, assigned_by: currentUser.id, start_date: start ? new Date(start).toISOString() : null, due_date: due ? new Date(due).toISOString() : null, progress: 0, status: 'Đang làm'
                }]).select().single();

                if (error) return alert("Lỗi: " + error.message);
                const taskId = taskData.id;

                let assigneeRows = selectedEmps.map(empId => ({ task_id: taskId, employee_id: empId }));
                await supabaseClient.from('task_assignees').insert(assigneeRows);

                let subtaskInsertData = currentSubtasks.map(s => ({
                    task_id: taskId, title: s.title, progress: 0, is_completed: false, order_index: s.order_index
                }));
                if(subtaskInsertData.length > 0) {
                    await supabaseClient.from('subtasks').insert(subtaskInsertData);
                }

                alert("✅ Tạo công việc thành công!");
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
