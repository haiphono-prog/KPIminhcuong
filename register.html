<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng ký - Quản lý KPI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #000; overflow: hidden; margin: 0; }
        /* MÀU NÚT MENU ĐANG CHỌN (DÙNG CHUNG CHO CẢ MÁY TÍNH & ĐIỆN THOẠI) */
        .nav-menu-btn.active-nav { background-color: #0ea5e9 !important; color: #000 !important; border-color: #0ea5e9 !important; opacity: 1 !important; }
        .nav-menu-btn { transition: all 0.2s; }

        /* MENU MOBILE 1 DÒNG SIÊU GỌN */
        @media (max-width: 767px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
            .nav-menu-text { display: none; }
            .nav-menu-btn { background: transparent !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px; font-size: 1.1rem; opacity: 1 !important; }
            #headerTitle { font-size: 0.7rem !important; white-space: normal !important; overflow: visible !important; line-height: 1.3; text-align: left; }
        }
        .unified-input {
            padding: 10px 15px !important;
            border-radius: 12px !important;
            font-size: 0.95rem !important;
            height: 48px !important;
            line-height: 1.5 !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
            background: #1a1d20 !important;
            border: 1px solid #2b3035 !important;
            color: #fff !important;
            width: 100%;
        }
        .unified-input:focus { border-color: #0ea5e9 !important; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15) !important; outline: none; }
        .dark-label { font-size: 0.75rem; font-weight: 700; color: #adb5bd; margin-bottom: 4px; letter-spacing: 0.5px; display: block; }
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column animate__animated animate__fadeInRight" style="background: #212529; z-index: 99999; overflow: hidden;">
        
        <!-- HEADER -->
        <div class="d-flex p-3 border-bottom border-secondary bg-dark flex-shrink-0 align-items-center mobile-margin-0" style="margin-left: -0.5px; margin-right: -0.5px; padding-top: max(env(safe-area-inset-top), 1rem) !important;">
            <button onclick="window.location.href='index.html'" class="btn btn-sm text-white-50 p-2 bg-transparent border-0 shadow-none">
                <i class="bi bi-chevron-left fs-4"></i>
            </button>
            <h6 class="fw-bold mb-0 text-info flex-grow-1 text-center" style="letter-spacing: 1px; font-size: 1.1rem; margin-right: 40px;">
                TẠO TÀI KHOẢN MỚI
            </h6>
        </div>

        <!-- BODY -->
        <div class="flex-grow-1 overflow-auto custom-scrollbar p-0 p-md-3 d-flex flex-column">
            <div class="mobile-px-half mt-3">
                <div class="p-4 rounded-4 mx-3 mx-md-auto mb-4" style="background: rgba(0,0,0,0.15); max-width: 450px;">
                    
                    <div class="mb-3 mobile-margin-0">
                        <label class="dark-label">HỌ VÀ TÊN</label>
                        <input type="text" id="fullName" class="unified-input" placeholder="Nguyễn Văn A" autocomplete="off">
                    </div>

                    <div class="mb-3 mobile-margin-0">
                        <label class="dark-label">PHÒNG BAN</label>
                        <input type="text" id="department" class="unified-input" placeholder="Kinh doanh, IT, Nhân sự..." autocomplete="off">
                    </div>

                    <div class="mb-3 mobile-margin-0">
                        <label class="dark-label">PHÂN QUYỀN (ROLE)</label>
                        <select id="role" class="unified-input">
                            <option value="employee">Nhân viên (Employee)</option>
                            <option value="admin">Quản trị viên (Admin)</option>
                        </select>
                    </div>

                    <div class="mb-3 mobile-margin-0">
                        <label class="dark-label">TÊN TÀI KHOẢN (Viết liền không dấu)</label>
                        <input type="text" id="username" class="unified-input" placeholder="Ví dụ: nhanvien1" autocomplete="off">
                    </div>
                    
                    <div class="mb-2 mobile-margin-0">
                        <label class="dark-label">MẬT KHẨU (Tối thiểu 6 ký tự)</label>
                        <input type="password" id="password" class="unified-input" placeholder="••••••••">
                    </div>

                    <div id="regMsg" class="text-center mt-3 small fw-bold" style="min-height: 20px;"></div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="d-flex mt-auto w-100 bg-dark border-top border-secondary flex-shrink-0" style="padding-bottom: env(safe-area-inset-bottom);">
            <button onclick="handleRegister()" id="btnRegister" class="btn py-3 fw-bold flex-grow-1 text-info bg-dark border-0 rounded-0 shadow-none" style="letter-spacing: 0.5px; font-size: 1.1rem;">
                <i class="bi bi-person-plus-fill me-2 fs-4 align-middle"></i> ĐĂNG KÝ NGAY
            </button>
        </div>
    </div>

   <script>
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        
        // Đổi tên biến thành supabaseClient để tránh xung đột với biến của thư viện
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function handleRegister() {
            const fullName = document.getElementById('fullName').value.trim();
            const department = document.getElementById('department').value.trim();
            const role = document.getElementById('role').value;
            const rawUsername = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('regMsg');
            const btnRegister = document.getElementById('btnRegister');
            
            // Ép tài khoản viết liền, không dấu, chữ thường
            const cleanUsername = rawUsername.toLowerCase().replace(/\s+/g, '');

            if (!fullName || !cleanUsername || !password) {
                msgBox.className = "text-center mt-3 small text-warning fw-bold";
                msgBox.innerText = "⚠️ Vui lòng nhập đủ thông tin.";
                return;
            }

            // TỰ ĐỘNG GHÉP ĐUÔI EMAIL ẢO
            const email = cleanUsername + "@kpi.com";

            msgBox.className = "text-center mt-3 small text-info fw-bold";
            msgBox.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang xử lý...';
            btnRegister.disabled = true;

            // Dùng supabaseClient thay vì supabase
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName,
                        department: department,
                        role: role
                    }
                }
            });

            if (error) {
                msgBox.className = "text-center mt-3 small text-danger fw-bold";
                msgBox.innerText = "❌ Lỗi: " + error.message;
                btnRegister.disabled = false;
            } else {
                msgBox.className = "text-center mt-3 small text-success fw-bold";
                msgBox.innerText = "✅ Tạo tài khoản thành công! Tự động chuyển về Đăng nhập...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
            }
        }
    </script>
</body>
</html>
