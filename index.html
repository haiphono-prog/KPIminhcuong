<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập - Quản lý KPI</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 1. CSS Lõi (Unified Design) -->
    <style>
        body { background-color: #000; overflow: hidden; margin: 0; }
        
        /* MÀU NÚT MENU ĐANG CHỌN (DÙNG CHUNG CHO CẢ MÁY TÍNH & ĐIỆN THOẠI) */
        .nav-menu-btn.active-nav { background-color: #0ea5e9 !important; color: #000 !important; border-color: #0ea5e9 !important; opacity: 1 !important; }
        .nav-menu-btn { transition: all 0.2s; }

        /* MENU MOBILE 1 DÒNG SIÊU GỌN */
        @media (max-width: 767px) {
            .mobile-px-half { padding-left: 0.5px !important; padding-right: 0.5px !important; }
            .mobile-margin-0 { margin-left: 0 !important; margin-right: 0 !important; }
            .nav-menu-text { display: none; }
            .nav-menu-btn { background: transparent !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px; font-size: 1.1rem; opacity: 1 !important; }
            #headerTitle { font-size: 0.7rem !important; white-space: normal !important; overflow: visible !important; line-height: 1.3; text-align: left; }
        }
        
        .unified-input {
            padding: 10px 15px !important;
            border-radius: 12px !important;
            font-size: 0.95rem !important;
            height: 48px !important;
            line-height: 1.5 !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
            background: #1a1d20 !important;
            border: 1px solid #2b3035 !important;
            color: #fff !important;
            width: 100%;
        }
        .unified-input:focus { 
            border-color: #0ea5e9 !important; 
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15) !important; 
            outline: none; 
        }
        .dark-label { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #adb5bd; 
            margin-bottom: 4px; 
            letter-spacing: 0.5px; 
            display: block;
        }
        
        .custom-scrollbar::-webkit-scrollbar { display: none !important; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <!-- 2. Bố cục Khung (Container Tràn Viền) -->
    <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column animate__animated animate__fadeInUp" style="background: #212529; z-index: 99999; overflow: hidden;">
        
        <!-- 3A. Header: Ép sát viền -->
        <div class="d-flex p-3 border-bottom border-secondary bg-dark flex-shrink-0 align-items-center mobile-margin-0" style="margin-left: -0.5px; margin-right: -0.5px; padding-top: max(env(safe-area-inset-top), 1rem) !important;">
            <div class="flex-grow-1 text-center">
                <h6 class="fw-bold mb-0 text-info" style="letter-spacing: 1px; font-size: 1.1rem;">
                    HỆ THỐNG QUẢN LÝ KPI
                </h6>
            </div>
        </div>

        <!-- 3B. Body: Trượt tự do -->
        <div class="flex-grow-1 overflow-auto custom-scrollbar p-0 p-md-3 d-flex flex-column justify-content-center">
            <div class="mobile-px-half">
                <!-- Khối thông tin gom vào thẻ bo tròn .rounded-4 -->
                <div class="p-4 rounded-4 mx-3 mx-md-auto" style="background: rgba(0,0,0,0.15); max-width: 450px;">
                    
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-white-50" style="font-size: 3.5rem;"></i>
                        <h4 class="text-white mt-2 fw-bold">ĐĂNG NHẬP</h4>
                        <p class="text-white-50 small">Vui lòng nhập tài khoản nội bộ</p>
                    </div>

                    <div class="mb-4 mobile-margin-0">
                        <label class="dark-label">TÀI KHOẢN ĐĂNG NHẬP</label>
                        <input type="text" id="username" class="unified-input" placeholder="Ví dụ: admin, nhanvien1..." autocomplete="off">
                    </div>
                    
                    <div class="mb-2 mobile-margin-0">
                        <label class="dark-label">MẬT KHẨU</label>
                        <input type="password" id="password" class="unified-input" placeholder="••••••••">
                    </div>

                    <div id="loginMsg" class="text-center mt-3 small fw-bold" style="min-height: 20px;"></div>

                    <!-- THÊM NÚT CHUYỂN TRANG ĐĂNG KÝ TẠI ĐÂY -->
                    <div class="text-center mt-3">
                        <a href="register.html" class="text-white-50 text-decoration-none small fw-bold">
                            Chưa có tài khoản? <span class="text-info border-bottom border-info pb-1">Tạo mới ngay</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3C. Footer: Chốt đáy, nút to bản, dính chặt mép -->
        <div class="d-flex mt-auto w-100 bg-dark border-top border-secondary flex-shrink-0" style="padding-bottom: env(safe-area-inset-bottom);">
            <button onclick="handleLogin()" id="btnLogin" class="btn py-3 fw-bold flex-grow-1 text-info bg-dark border-0 rounded-0 shadow-none" style="letter-spacing: 0.5px; font-size: 1.1rem;">
                <i class="bi bi-box-arrow-in-right me-2 fs-4 align-middle"></i> VÀO HỆ THỐNG
            </button>
        </div>
    </div>

    <!-- 4. Javascript: Supabase Logic -->
    <script>
        // Cấu hình Supabase
        const supabaseUrl = 'https://muzfjjyntqzsvwkwmors.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11emZqanludHF6c3Z3a3dtb3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTAwNzgsImV4cCI6MjEwNzE4NjA3OH0.T8UcIVo6IwUssCGPNvXdeY5BFkGhjyR2GehTQJbgmkE';
        
        // ĐỔI TÊN BIẾN THÀNH supabaseClient
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin() {
            const rawUsername = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('loginMsg');
            const btnLogin = document.getElementById('btnLogin');
            
            // THÊM DÒNG NÀY: Ép tài khoản viết liền, chữ thường giống hệt lúc đăng ký
            const cleanUsername = rawUsername.toLowerCase().replace(/\s+/g, '');

            if (!cleanUsername || !password) {
                msgBox.className = "text-center mt-3 small text-warning fw-bold";
                msgBox.innerText = "⚠️ Vui lòng nhập đầy đủ thông tin.";
                return;
            }

            // TỰ ĐỘNG GHÉP ĐUÔI EMAIL ẢO
            const email = cleanUsername + "@kpi.com";

            msgBox.className = "text-center mt-3 small text-info fw-bold";
            msgBox.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang xác thực...';
            btnLogin.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                msgBox.className = "text-center mt-3 small text-danger fw-bold";
                msgBox.innerText = "❌ Lỗi từ máy chủ: " + error.message; // Hiển thị nguyên văn lỗi của Supabase
                btnLogin.disabled = false;
            } else {
                msgBox.className = "text-center mt-3 small text-success fw-bold";
                msgBox.innerText = "✅ Đăng nhập thành công! Đang vào Dashboard...";
                
                setTimeout(() => {
                    window.location.href = "dashboard.html"; 
                }, 1000);
            }
        }
    </script>
</body>
</html>
